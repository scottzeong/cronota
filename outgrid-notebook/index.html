<title>cronota · 아웃그리드 손글씨 노트</title>
<meta name="description" content="펜으로 쓰는 손글씨 노트. 노트는 내 기기에 저장되고, 원하면 내 구글 드라이브와 동기화됩니다." />
<style>
  :root {
    /* outgrid palette: paper + deep green */
    --bg: #F5F1E8;          /* paper-100 */
    --surface: #FCFAF5;     /* paper-050 */
    --paper: #FFFDF8;       /* writing sheet */
    --line: #E8E0CF;
    --margin-line: rgba(186, 70, 58, 0.40);
    --ink: #1C2824;         /* ink-900 */
    --ink-2: #33403A;
    --muted: #5E665F;
    --faint: #9A9F95;
    --hair: #E3DCCB;
    --hover: #F0EADD;
    --press: #E7DFCD;
    --dark: #244D3A;        /* forest-700 */
    --dark-2: #1B3B2C;
    --river: #3E6F73;
    --clay: #8A5A3B;
    --sand: #D9C8A9;
    --focus: #8A5A3B;
    --danger: #963F3B;
    --shadow: 0 1px 0 rgba(28,40,36,.03), 0 18px 40px -30px rgba(28,40,36,.30);
    --sans: "wantedSans", "Wanted Sans Variable", "Wanted Sans", -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Hiragino Sans", "Yu Gothic", "PingFang SC", "Microsoft YaHei", "Noto Sans KR", "Noto Sans JP", "Noto Sans SC", "Segoe UI", sans-serif;
    --serif: "maruBuri", "MaruBuri", "Batang", "Noto Serif KR", serif;
    --gap: 32px;
    --margin-x: 60px;
    --r-sm: 10px;
    --r-md: 13px;
    --r-lg: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans);
    word-break: keep-all;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; opacity: .3; }
  input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }
  ::selection { background: rgba(36,77,58,.16); }
  svg.i { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.sm { width: 16px; height: 16px; }
  .muted { color: var(--faint); }

  /* ---------- Header ---------- */
  .top { position: sticky; top: 0; z-index: 30; background: var(--bg); }
  .top-inner { max-width: 1360px; margin: 0 auto; padding: 14px 24px 6px; display: flex; align-items: center; gap: 20px; }
  .logo { display: block; height: 34px; width: auto; flex: none; }
  .search { position: relative; flex: 1; max-width: 520px; margin: 0 auto; }
  .search input { width: 100%; height: 40px; border-radius: 999px; border: 1px solid transparent; background: var(--surface); padding: 0 80px 0 42px; font-size: 14px; outline: none; transition: box-shadow .15s, background .15s; box-shadow: inset 0 0 0 1px var(--hair); }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { background: #fff; box-shadow: inset 0 0 0 1.5px var(--dark), 0 0 0 4px rgba(36,77,58,.08); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .s-icon { position: absolute; left: 15px; top: 11px; color: var(--faint); pointer-events: none; width: 18px; height: 18px; }
  .search .s-actions { position: absolute; right: 4px; top: 4px; display: flex; }
  .search .s-actions .icon-btn { width: 32px; height: 32px; border-radius: 999px; }
  .head-actions { display: flex; align-items: center; gap: 4px; flex: none; }
  .icon-btn { width: 36px; height: 36px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--ink-2); transition: background .15s, color .15s; flex: none; }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn[aria-pressed="true"] { background: var(--dark); color: var(--surface); }
  .settings-btn { position: relative; }
  .settings-btn .dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 999px; background: #3F8A5E; box-shadow: 0 0 0 2px var(--bg); display: none; }
  .settings-btn.ai-on .dot { display: block; }
  .lang-pick { position: relative; height: 36px; padding: 0 10px; border-radius: var(--r-sm); display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  .lang-pick:hover { background: var(--hover); }
  .lang-pick select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }

  /* handwriting search popover */
  .pad-pop { position: absolute; top: 48px; left: 0; right: 0; min-width: 300px; background: var(--surface); border: 1px solid var(--hair); border-radius: 18px; box-shadow: 0 20px 48px -24px rgba(28,40,36,.35); padding: 14px; z-index: 40; display: none; }
  .pad-pop.open { display: block; }
  .pad-pop .pad-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 13px; font-weight: 600; }
  .pad-pop .pad-head span.muted { font-weight: 400; font-size: 12px; text-align: right; }
  .pad-wrap { height: 96px; border-radius: var(--r-md); overflow: hidden; box-shadow: inset 0 0 0 1px var(--hair); }
  #padCanvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; background-color: var(--paper); background-image: linear-gradient(to bottom, transparent 63px, var(--line) 63px); background-size: 100% 64px; }
  .pad-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; }
  .kw-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); font-size: 12px; align-items: center; }
  .kw-chip { height: 26px; padding: 0 10px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--hair); color: var(--muted); font-size: 12px; }
  .kw-chip:hover { color: var(--dark); box-shadow: inset 0 0 0 1px var(--dark); }

  /* mobile tabs */
  .mtabs { display: none; max-width: 1360px; margin: 6px 12px 10px; padding: 4px; background: var(--press); border-radius: 999px; }
  .mtab { flex: 1; height: 34px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); transition: background .15s, color .15s; }
  .mtab[aria-selected="true"] { background: var(--dark); color: var(--surface); box-shadow: 0 6px 14px -8px rgba(36,77,58,.6); }
  /* One panel at a time (phones, and tablets unless side-by-side is turned on) */
  body.tabs .mtabs { display: flex; }
  body.tabs main { grid-template-columns: minmax(0, 1fr) !important; }
  body.tabs[data-tab="write"] #notesPanel, body.tabs[data-tab="notes"] #writePanel { display: none; }
  @media (min-width: 900px) { body.tabs .mtabs { margin: 6px 24px 10px; } body.tabs main { padding-top: 0; } }

  /* ---------- Buttons ---------- */
  .btn { height: 36px; padding: 0 14px; border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 13px; background: var(--hover); color: var(--ink); white-space: nowrap; transition: background .15s; }
  .btn:hover:not(:disabled) { background: var(--press); }
  .btn.primary { background: var(--dark); color: var(--surface); }
  .btn.primary:hover:not(:disabled) { background: var(--dark-2); }
  .btn.ghost { background: none; color: var(--muted); }
  .btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--ink); }

  /* ---------- Layout ---------- */
  main { flex: 1; min-height: 0; width: 100%; max-width: 1360px; margin: 0 auto; padding: 10px 24px 24px; display: grid; grid-template-columns: minmax(0, 1.22fr) minmax(0, .78fr); gap: 16px; }
  .panel { background: var(--surface); border-radius: var(--r-lg); display: flex; flex-direction: column; min-height: 0; overflow: hidden; box-shadow: 0 0 0 1px var(--hair), var(--shadow); }

  /* ---------- Write panel ---------- */
  .toolbar { display: flex; align-items: center; gap: 0; padding: 10px 12px; border-bottom: 1px solid var(--hair); background: var(--surface); flex-wrap: wrap; row-gap: 8px; }
  .tgroup { display: flex; align-items: center; gap: 2px; }
  .sep { width: 1px; height: 18px; background: var(--hair); margin: 0 7px; flex: none; }
  .swatch { width: 26px; height: 32px; border-radius: 999px; display: grid; place-items: center; }
  .swatch span { width: 14px; height: 14px; border-radius: 999px; background: var(--c); transition: box-shadow .15s, transform .15s; }
  .swatch:hover span { transform: scale(1.12); }
  .swatch[aria-pressed="true"] span { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 4px var(--dark); }
  .swatch.hl span { width: 16px; height: 9px; border-radius: 2px; opacity: .6; transform: rotate(-14deg); }
  .swatch.hl:hover span { transform: rotate(-14deg) scale(1.12); }
  .swatch.hl[aria-pressed="true"] span { opacity: .85; }
  .wbtn { width: 26px; height: 32px; border-radius: var(--r-sm); display: grid; place-items: center; }
  .wbtn span { border-radius: 999px; background: var(--ink-2); }
  .wbtn:hover { background: var(--hover); }
  .wbtn[aria-pressed="true"] { background: var(--press); }
  .wbtn[aria-pressed="true"] span { background: var(--dark); }
  .tool { height: 32px; width: 32px; border-radius: var(--r-sm); display: inline-grid; place-items: center; color: var(--ink-2); transition: background .15s, color .15s; }
  .tool:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .tool[aria-pressed="true"] { background: var(--dark); color: var(--surface); }
  #pageHBtn[aria-pressed="true"], #pageVBtn[aria-pressed="true"] { background: var(--press); color: var(--ink); }
  .pen-mode { height: 32px; width: 32px; border-radius: var(--r-sm); display: grid; place-items: center; transition: background .15s, color .15s, opacity .15s; }
  .pen-mode.on { background: var(--dark); color: var(--surface); }
  .pen-mode.off { color: var(--ink-2); opacity: .32; }
  .pen-mode.off:hover { opacity: .6; background: var(--hover); }
  #saveBtn { height: 34px; padding: 0 16px 0 13px; margin-left: auto; gap: 6px; border-radius: 999px; box-shadow: 0 8px 18px -10px rgba(36,77,58,.7); }
  #saveBtn:disabled { box-shadow: none; }
  #cancelEditBtn { margin-left: auto; }
  #cancelEditBtn:not([hidden]) + #saveBtn { margin-left: 4px; }
  .pnote.editing canvas { opacity: .3; }

  .canvas-wrap { position: relative; flex: 1; min-height: 300px; }
  .canvas-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; background: var(--paper); scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; }
  .canvas-scroll::-webkit-scrollbar { display: none; }
  .canvas-scroll.h { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; }
  #pageSnaps { position: absolute; left: 0; top: 0; pointer-events: none; }
  #pageSnaps i { position: absolute; display: block; scroll-snap-align: start; }
  .pnav { display: flex; align-items: center; flex: none; font-size: 12px; color: var(--muted); }
  .pnav span { min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; color: var(--ink-2); }
  .pnav .tool { width: 26px; }
  .pnav .tool:disabled { opacity: .3; }
  #writePanel { container-type: inline-size; }
  /* Narrow writing panel (e.g. side by side on a laptop): keep the toolbar on one row */
  @container (max-width: 800px) {
    .toolbar .sep { margin: 0 4px; }
    #saveBtn { width: 36px; padding: 0; justify-content: center; }
    #saveBtn #saveLabel { display: none; }
  }
  .paper {
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, transparent calc(var(--margin-x) - 1px), var(--margin-line) calc(var(--margin-x) - 1px), var(--margin-line) var(--margin-x), transparent var(--margin-x)),
      linear-gradient(to bottom, transparent calc(var(--gap) - 1px), var(--line) calc(var(--gap) - 1px));
    background-size: 100% 100%, 100% var(--gap);
    background-repeat: no-repeat, repeat;
  }
  #ink { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: crosshair; }
  #ink.erasing { cursor: cell; }
  #ink.paper { background-size: var(--page-w, 100%) 100%, 100% var(--gap); background-repeat: repeat-x, repeat; }

  /* ---------- Notes panel ---------- */
  .filters { padding: 10px 12px; border-bottom: 1px solid var(--hair); display: flex; align-items: center; gap: 8px; min-height: 53px; }
  .chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; align-items: center; flex: 1; min-width: 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { height: 32px; padding: 0 12px; border-radius: 999px; white-space: nowrap; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); flex: none; transition: background .15s; }
  .chip:hover { background: var(--hover); }
  .chip b { color: var(--c); font-weight: 600; }
  .chip .n { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { background: var(--dark); color: var(--surface); }
  .chip[aria-pressed="true"] b, .chip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
  #sortBtn { height: 32px; padding: 0 10px; font-weight: 500; }

  .banner { display: none; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; background: #EAF0EA; color: var(--ink-2); font-size: 13px; border-bottom: 1px solid var(--hair); }
  .banner.show { display: flex; }
  .banner button { font-weight: 600; color: var(--dark); white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }

  .list { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; touch-action: pan-y; padding: 14px; background: var(--bg); scroll-snap-type: y mandatory; scroll-padding: 14px; scrollbar-width: none; }
  .list::-webkit-scrollbar { display: none; }
  .list.h { display: flex; gap: 14px; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; scroll-snap-type: x mandatory; }
  .npage { display: flex; flex-direction: column; flex: none; scroll-snap-align: start; scroll-snap-stop: always; }
  .list:not(.h) .npage + .npage { margin-top: 14px; }
  .npage .fill { flex: 1; min-height: 0; }
  .page { border-radius: 14px; overflow: hidden; background: var(--paper); box-shadow: 0 0 0 1px var(--hair), 0 10px 24px -22px rgba(28,40,36,.35); }
  .page-scroll { overflow: hidden; width: 100%; }
  .pnote canvas { max-width: 100%; }
  .pnote { position: relative; cursor: pointer; }
  .pnote canvas { display: block; }
  .pnote.done canvas { opacity: .35; }
  .pnote.selected::after { content: ''; position: absolute; inset: 3px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px var(--dark); pointer-events: none; }
  .note-actions { position: absolute; top: 5px; right: 10px; z-index: 2; display: flex; align-items: center; gap: 2px; flex-wrap: wrap; justify-content: flex-end; background: var(--surface); border-radius: var(--r-md); padding: 3px; box-shadow: 0 0 0 1px var(--hair); cursor: default; }
  .note-actions .icon-btn { width: 30px; height: 30px; }
  .note-time { position: absolute; top: 9px; right: 14px; font-size: 11px; color: var(--faint); pointer-events: none; font-variant-numeric: tabular-nums; }
  .day-head { position: sticky; top: 0; z-index: 3; padding: 10px 14px; font-family: var(--serif); font-size: 13px; font-weight: 600; color: var(--dark); background: var(--bg); border-bottom: 1px solid var(--hair); letter-spacing: .01em; }
  .day-head:not(:first-child) { border-top: 1px solid var(--hair); }
  .page-end { height: calc(var(--gap) * 3); }
  .list.paged .page-end { display: none; }
  .tag-pick { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px 0 10px; border-radius: var(--r-sm); color: var(--c); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .tag-pick:hover { background: var(--hover); }
  .tag-pick select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .tag-pick svg.i { width: 13px; height: 13px; }
  .done-btn { height: 28px; padding: 0 10px; border-radius: var(--r-sm); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); white-space: nowrap; }
  .done-btn:hover { background: var(--hover); }
  .done-btn[aria-pressed="true"] { background: var(--dark); color: var(--surface); }
  .edit-row { padding: 10px 14px 12px; display: flex; gap: 6px; background: var(--surface); border-bottom: 1px solid var(--hair); cursor: default; }
  .edit-row input { flex: 1; min-width: 0; height: 36px; border: 0; background: #fff; box-shadow: inset 0 0 0 1.5px var(--dark); border-radius: var(--r-sm); padding: 0 12px; font-size: 14px; outline: none; }
  .empty { text-align: center; color: var(--faint); padding: 64px 16px; line-height: 1.8; font-size: 13px; }
  .empty b { color: var(--dark); display: block; font-family: var(--serif); font-size: 17px; font-weight: 600; margin-bottom: 4px; }

  /* ---------- Toast ---------- */
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--dark); color: var(--surface); padding: 11px 18px; border-radius: 999px; box-shadow: 0 14px 30px -14px rgba(28,40,36,.55); font-size: 13px; display: none; align-items: center; gap: 16px; z-index: 70; max-width: calc(100vw - 32px); }
  #toast.show { display: flex; }
  #toast button { color: var(--sand); font-weight: 600; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- Dialogs ---------- */
  dialog { border: 0; border-radius: 22px; padding: 0; width: min(460px, calc(100vw - 32px)); background: var(--surface); box-shadow: 0 0 0 1px var(--hair), 0 30px 70px -30px rgba(28,40,36,.45); color: var(--ink); }
  dialog::backdrop { background: rgba(28,40,36,.32); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 8px; }
  .dlg-head h2 { margin: 0; font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: -.02em; color: var(--dark); }
  .dlg-body { padding: 6px 22px 22px; display: flex; flex-direction: column; gap: 20px; max-height: 75vh; overflow-y: auto; }
  .sec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--clay); text-transform: uppercase; letter-spacing: .06em; }
  .sec p { margin: 0 0 12px; font-size: 13px; color: var(--muted); line-height: 1.65; }
  .sec p b { color: var(--ink-2); font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .field input[type=password], .field input[type=text] { height: 40px; border: 0; background: #fff; box-shadow: inset 0 0 0 1px var(--hair); border-radius: var(--r-sm); padding: 0 12px; font-size: 14px; outline: none; }
  .field input:focus { box-shadow: inset 0 0 0 1.5px var(--dark), 0 0 0 4px rgba(36,77,58,.08); }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .result { font-size: 12px; padding: 9px 12px; border-radius: var(--r-sm); margin-bottom: 12px; display: none; }
  .result.show { display: block; }
  .gd-uri { font-size: 12px !important; word-break: break-all; }
  .dlg-foot { margin: 0; font-size: 12px; color: var(--faint); }
  .dlg-foot a { color: var(--muted); text-underline-offset: 3px; }
  .dlg-foot a:hover { color: var(--dark); }
  .gd-uri code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; background: var(--hover); padding: 2px 6px; border-radius: 6px; color: var(--ink-2); user-select: all; -webkit-user-select: all; }
  #syncBtn { position: relative; }
  #syncBtn .dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 999px; background: #B7793F; box-shadow: 0 0 0 2px var(--bg); display: none; }
  #syncBtn.warn .dot { display: block; }
  #syncBtn.busy svg { animation: syncPulse 1s ease-in-out infinite; }
  @keyframes syncPulse { 50% { opacity: .3; } }
  .result.ok { background: #E8F0E9; color: var(--dark); }
  .result.err { background: #F6E9E6; color: var(--danger); }
  .result.info { background: var(--hover); color: var(--muted); }
  .range-row { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .range-row input { flex: 1; accent-color: var(--dark); }
  .range-row > span:first-child { min-width: 72px; }
  .range-row + .range-row { margin-top: 8px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; padding: 10px 0 0; }
  .switch-row input { width: 18px; height: 18px; accent-color: var(--dark); }
  hr.div { border: 0; border-top: 1px solid var(--hair); margin: 0; }

  .sym-list { display: flex; flex-direction: column; }
  .sym-row { display: flex; align-items: center; gap: 14px; padding: 10px 2px; border-bottom: 1px solid var(--hair); }
  .sym-row:last-child { border-bottom: 0; }
  .sym-row .glyph { width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--paper); box-shadow: inset 0 0 0 1px var(--hair); display: grid; place-items: center; font-size: 16px; font-weight: 600; color: var(--c); flex: none; }
  .sym-row .name { font-weight: 600; font-size: 13px; color: var(--ink); min-width: 64px; }
  .sym-row .desc { font-size: 13px; color: var(--muted); flex: 1; }
  .tips { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); line-height: 1.75; }
  .tips li + li { margin-top: 4px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .sep { margin: 0 6px; }
  }
  @media (max-width: 899px) {
    main { padding: 0 12px 12px; }
    .top-inner { padding: 12px 12px 4px; gap: 8px; }
    .logo { height: 27px; }
    .toolbar { padding: 8px; }
    .sep { margin: 0 4px; }
    .swatch, .wbtn { width: 26px; }
    .tool, .pen-mode { width: 30px; }
  }
  @media (max-width: 480px) {
    .lang-pick .code { display: none; }
    .lang-pick { padding: 0 8px; }
    .icon-btn { width: 32px; }
    .search { min-width: 0; }
    .search input { padding: 0 38px 0 12px; }
    .search .s-icon { display: none; }
    .search:has(#clearSearchBtn:not([hidden])) input { padding-right: 70px; }
    .head-actions { gap: 0; }
    .head-actions .icon-btn { width: 30px; }
    .top-inner { gap: 6px; }
  }
</style>

    <div class="search" id="searchBox">
      <i data-icon="search" class="s-icon"></i>
      <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search" data-i18n-ph="searchPh" data-i18n-aria="searchPh" />
      <div class="s-actions">
        <button id="clearSearchBtn" class="icon-btn" data-i18n-title="clearSearch" hidden><i data-icon="x"></i></button>
        <button id="padToggleBtn" class="icon-btn" data-i18n-title="handSearch" aria-expanded="false"><i data-icon="pen"></i></button>
      </div>
      <div class="pad-pop" id="padPop" role="dialog">
        <div class="pad-head"><span data-i18n="handSearch"></span> <span class="muted" id="padNote"></span></div>
        <div class="pad-wrap"><canvas id="padCanvas"></canvas></div>
        <div class="pad-actions">
          <button class="btn ghost" id="padClearBtn" data-i18n="clear"></button>
          <button class="btn primary" id="padRunBtn"><i data-icon="search" class="sm"></i><span data-i18n="search"></span></button>
        </div>
        <div class="kw-row" id="kwRow"></div>
      </div>
    </div>

    <div class="head-actions">
      <label class="lang-pick" data-i18n-title="language"><i data-icon="globe" class="sm"></i><span class="code" id="langCode"></span>
        <select id="langSelect" data-i18n-aria="language">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
        </select>
      </label>
      <button id="syncBtn" class="icon-btn" hidden data-i18n-title="gdSyncNow"><i data-icon="cloud"></i><span class="dot"></span></button>
      <button id="layoutBtn" class="icon-btn" data-i18n-title="splitView" data-i18n-aria="splitView"><i data-icon="columns"></i></button>
      <button id="helpBtn" class="icon-btn" data-i18n-title="help"><i data-icon="help"></i></button>
      <button id="settingsBtn" class="icon-btn settings-btn" data-i18n-title="settings"><i data-icon="sliders"></i><span class="dot"></span></button>
    </div>
  </div>
  <div class="mtabs" role="tablist">
    <button class="mtab" role="tab" data-tab="write" aria-selected="true" data-i18n="tabWrite"></button>
    <button class="mtab" role="tab" data-tab="notes" aria-selected="false"><span data-i18n="tabNotes"></span> <span id="mtabCount"></span></button>
  </div>
</header>

<main>
  <!-- ========== Write ========== -->
  <section class="panel" id="writePanel">
    <div class="toolbar">
      <div class="tgroup" id="penBtns"></div>
      <div class="sep"></div>
      <div class="tgroup" id="widthBtns"></div>
      <div class="sep"></div>
      <div class="tgroup" id="hlBtns"></div>
      <div class="sep"></div>
      <div class="tgroup">
        <button class="tool" id="eraserBtn" aria-pressed="false" data-i18n-title="eraser"><i data-icon="eraser"></i></button>
        <button class="tool" id="undoBtn" data-i18n-title="undo" disabled><i data-icon="undo"></i></button>
        <button class="tool" id="redoBtn" data-i18n-title="redo" disabled><i data-icon="redo"></i></button>
        <button class="tool" id="clearBtn" data-i18n-title="clearCanvas" disabled><i data-icon="trash"></i></button>
      </div>
      <div class="sep"></div>
      <div class="tgroup">
        <button class="tool" id="pageHBtn" data-i18n-title="pageModeH"><i data-icon="pagesH"></i></button>
        <button class="tool" id="pageVBtn" data-i18n-title="pageModeV"><i data-icon="pagesV"></i></button>
        <button class="pen-mode" id="penModeBtn"><i data-icon="penTip"></i></button>
      </div>
      <div class="sep"></div>
      <div class="pnav">
        <button class="tool" id="prevPageBtn" data-i18n-title="prevPage"></button>
        <span id="pageLabel">1 / 1</span>
        <button class="tool" id="nextPageBtn" data-i18n-title="nextPage"></button>
      </div>
      <button class="tool" id="cancelEditBtn" hidden data-i18n-title="cancelEdit" data-i18n-aria="cancelEdit"><i data-icon="x"></i></button>
      <button class="btn primary" id="saveBtn" disabled><i data-icon="check" class="sm"></i><span id="saveLabel"></span></button>
    </div>

    <div class="canvas-wrap">
      <div class="canvas-scroll" id="canvasScroll">
        <canvas id="ink" class="paper"></canvas>
        <div id="pageSnaps"></div>
      </div>
    </div>
  </section>

  <!-- ========== Notes ========== -->
  <section class="panel" id="notesPanel">
    <div class="filters">
      <div class="chips" id="tagChips"></div>
      <button class="btn ghost" id="sortBtn"><i data-icon="sort" class="sm"></i><span id="sortLabel"></span></button>
      <div class="pnav" id="notesNav" hidden>
        <button class="tool" id="nPrevBtn" data-i18n-title="prevPage"></button>
        <span id="nPageLabel">1 / 1</span>
        <button class="tool" id="nNextBtn" data-i18n-title="nextPage"></button>
      </div>
    </div>
    <div class="banner" id="banner"><span id="bannerText"></span><button id="bannerClear" data-i18n="clearSearch"></button></div>
    <div class="list" id="list"></div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<!-- ========== Help ========== -->
<dialog id="help">
  <div class="dlg-head">
    <h2 data-i18n="help"></h2>
    <button class="icon-btn" data-close data-i18n-title="close"><i data-icon="x"></i></button>
  </div>
  <div class="dlg-body">
    <div class="sec">
      <h3 data-i18n="helpSymbols"></h3>
      <p data-i18n="helpSymbolsIntro"></p>
      <div class="sym-list" id="symList"></div>
    </div>
    <hr class="div" />
    <div class="sec">
      <h3 data-i18n="helpTips"></h3>
      <ul class="tips" id="tipList"></ul>
    </div>
  </div>
</dialog>

<!-- ========== Settings ========== -->
<dialog id="settings">
  <div class="dlg-head">
    <h2 data-i18n="settings"></h2>
    <button class="icon-btn" data-close data-i18n-title="close"><i data-icon="x"></i></button>
  </div>
  <div class="dlg-body">
    <div class="sec">
      <h3 data-i18n="aiTitle"></h3>
      <p data-i18n-html="aiDesc"></p>
      <div class="field">
        <label for="keyInput" data-i18n="apiKey"></label>
        <input id="keyInput" type="password" placeholder="AIza..." autocomplete="off" spellcheck="false" />
      </div>
      <div class="field">
        <label for="modelInput" data-i18n="model"></label>
        <input id="modelInput" type="text" list="modelList" autocomplete="off" spellcheck="false" />
        <datalist id="modelList">
          <option value="gemini-3.5-flash-lite"></option>
          <option value="gemini-3.6-flash"></option>
          <option value="gemini-3.8-flash"></option>
        </datalist>
      </div>
      <div class="result" id="aiResult"></div>
      <div class="btn-row">
        <button class="btn ghost" id="keyClearBtn" data-i18n="keyClear"></button>
        <button class="btn" id="keyTestBtn" data-i18n="keyTest"></button>
        <button class="btn primary" id="keySaveBtn" data-i18n="save"></button>
      </div>
    </div>
    <hr class="div" />
    <div class="sec">
      <h3 data-i18n="writing"></h3>
      <div class="range-row">
        <span data-i18n="lineGap"></span>
        <input id="gapRange" type="range" min="24" max="56" step="2" />
        <span id="gapLabel" style="width:36px;text-align:right"></span>
      </div>
      <div class="range-row">
        <span data-i18n="pressureSetting"></span>
        <input id="pressureRange" type="range" min="0" max="100" step="10" />
        <span id="pressureLabel" style="width:36px;text-align:right"></span>
      </div>
      <label class="switch-row"><span data-i18n="fingerSetting"></span>
        <input type="checkbox" id="fingerCheck" />
      </label>
    </div>
    <hr class="div" />
    <div class="sec" id="gdSec">
      <h3 data-i18n="gdTitle"></h3>
      <p data-i18n="gdDesc"></p>
      <div class="field" id="gdClientField">
        <label for="gdClientInput" data-i18n="gdClient"></label>
        <input id="gdClientInput" type="text" placeholder="1234567890-xxxx.apps.googleusercontent.com" autocomplete="off" spellcheck="false" />
      </div>
      <p class="gd-uri" id="gdUriRow"><span data-i18n="gdRedirect"></span> <code id="gdUri"></code></p>
      <div class="result" id="gdResult"></div>
      <div class="btn-row">
        <button class="btn ghost" id="gdDisconnectBtn" data-i18n="gdDisconnect"></button>
        <button class="btn" id="gdSyncBtn" data-i18n="gdSyncNow"></button>
        <button class="btn primary" id="gdConnectBtn" data-i18n="gdConnect"></button>
      </div>
    </div>
    <hr class="div" />
    <div class="sec">
      <h3 data-i18n="data"></h3>
      <p data-i18n="dataDesc"></p>
      <div class="btn-row" style="justify-content:flex-start">
        <button class="btn" id="exportBtn" data-i18n="export"></button>

function getBox(pts) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of pts) {
    if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
  }
  return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
}

/* =========================================================
   Storage: IndexedDB, with localStorage as a fallback
   ========================================================= */
const idb = (() => {
  let dbp = null;
  function open() {
    if (!dbp) {
      dbp = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) { reject(new Error('no IndexedDB')); return; }
        const req = indexedDB.open('cronota', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return dbp;
  }
  async function get(key) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const r = db.transaction('kv', 'readonly').objectStore('kv').get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }
  async function set(key, value) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('aborted'));
    });
  }
  return { get, set };
})();

function sanitizeStroke(s) {
  if (!s || !Array.isArray(s.points)) return null;
  const points = s.points
    .filter((p) => p && Number.isFinite(+p.x) && Number.isFinite(+p.y))
    .map((p) => ({ x: Math.round(+p.x * 10) / 10, y: Math.round(+p.y * 10) / 10, p: Number.isFinite(+p.p) ? Math.round(+p.p * 100) / 100 : 0.5 }));
  if (!points.length) return null;
  const out = {
    color: /^#[0-9a-fA-F]{3,8}$/.test(s.color) ? s.color : '#1E293B',
    width: Math.min(40, Math.max(0.5, +s.width || 2.8)),
    points
  };
  if (s.hl) out.hl = true;
  return out;
}
function migrateTag(b) {
  if (b.tagType === 'question') return 'ref';                         // △ now means 참고
  if (b.tagSource === 'auto' && b.tagType === 'idea') return 'none';  // saved without a symbol
  return TAGS[b.tagType] ? b.tagType : 'none';
}
function sanitizeBlock(b) {
  if (!b || typeof b !== 'object') return null;
  const strokes = Array.isArray(b.strokes) ? b.strokes.map(sanitizeStroke).filter(Boolean) : [];
  if (!strokes.length) return null;
  return {
    id: typeof b.id === 'string' && b.id ? b.id.slice(0, 80) : uid(),
    tagType: migrateTag(b),
    tagSource: ['symbol', 'auto', 'ai', 'user'].includes(b.tagSource) ? b.tagSource : 'symbol',
    status: b.status === 'done' ? 'done' : 'open',
    priority: b.priority === 'high' ? 'high' : 'normal',
    createdAt: Number.isFinite(Date.parse(b.createdAt)) ? new Date(b.createdAt).toISOString() : new Date().toISOString(),
    updatedAt: Number.isFinite(Date.parse(b.updatedAt)) ? new Date(b.updatedAt).toISOString()
      : Number.isFinite(Date.parse(b.createdAt)) ? new Date(b.createdAt).toISOString() : new Date().toISOString(),
    text: toStr(b.text ?? b.ocrText).trim(),
    keywords: toKeywords(b.keywords),
    gap: Math.min(56, Math.max(20, +b.gap || 32)),
    ...(Number.isInteger(b.pos) && b.pos >= 0 ? { pos: Math.min(b.pos, 999) } : {}),
    strokes
  };
}

let blocks = [];
let storageWarned = false;

async function loadBlocks() {
  let fromIdb = null, fromLs = null;
  try { fromIdb = await idb.get('notes'); } catch {}
  try {
    const raw = localStorage.getItem('cronota_notes');
    if (raw) fromLs = JSON.parse(raw);
  } catch {}
  let chosen = null;
  if (fromIdb && fromLs) chosen = (fromLs.savedAt || 0) > (fromIdb.savedAt || 0) ? fromLs : fromIdb;
  else chosen = fromIdb || fromLs;
  let list = chosen && Array.isArray(chosen.blocks) ? chosen.blocks : null;
  if (!list) {
    try {
      const old = localStorage.getItem('shadowink_blocks_v1'); // first prototype
      if (old) list = JSON.parse(old);
    } catch {}
  }
  if (!Array.isArray(list)) list = [];
  blocks = list.map(sanitizeBlock).filter(Boolean);
  tombs = sanitizeTombs(chosen && chosen.deleted);
  sigs = new Map(blocks.map((b) => [b.id, blockSig(b)]));
  if (!chosen) persist();
}

/* Change tracking for sync: every note carries updatedAt, deleted notes leave a
   tombstone (id -> time) so a deletion on one device also reaches the others. */
let tombs = {};
let sigs = new Map();
function blockSig(b) {
  const pts = b.strokes.reduce((n, s) => n + s.points.length, 0);
  const last = b.strokes.length ? b.strokes[b.strokes.length - 1].points.slice(-1)[0] : null;
  return JSON.stringify([b.tagType, b.tagSource, b.status, b.priority, b.text, b.keywords, b.gap, b.createdAt, b.strokes.length, pts, last && last.x, last && last.y]);
}
function sanitizeTombs(o) {
  const out = {};
  const cutoff = Date.now() - 180 * 864e5;
  if (o && typeof o === 'object') for (const [id, ts] of Object.entries(o)) if (typeof id === 'string' && +ts > cutoff) out[id.slice(0, 80)] = +ts;
  return out;
}
function trackChanges() {
  const now = Date.now();
  const seen = new Set();
  for (const b of blocks) {
    seen.add(b.id);
    const sig = blockSig(b);
    if (sigs.get(b.id) === sig) continue;
    if (sigs.has(b.id) || tombs[b.id] || !b.updatedAt) b.updatedAt = new Date(now).toISOString();
    delete tombs[b.id];
    sigs.set(b.id, sig);
  }
  for (const id of [...sigs.keys()]) if (!seen.has(id)) { sigs.delete(id); tombs[id] = now; }
}

let saveChain = Promise.resolve();
function persist(fromSync = false) {
  trackChanges();
  if (!fromSync) gdSchedule();
  const payload = { savedAt: Date.now(), blocks: blocks.map((b) => ({ ...b })), deleted: { ...tombs } };
  saveChain = saveChain.then(async () => {
    try {
      await idb.set('notes', payload);
      lsDel('cronota_notes');
    } catch (e) {
      if (!lsSet('cronota_notes', JSON.stringify(payload))) {
        if (!storageWarned) { storageWarned = true; toast(t('storageFull')); }
        return;
      }
    }
    storageWarned = false;
  });
  return saveChain;
}

/* =========================================================
   Stroke rendering (highlighter strokes go under the ink)
   ========================================================= */
/* Pressure → width. Pressure 0.5 draws the nominal width; the sensitivity setting
   (0–100) sets how far light/heavy pressure moves away from it (up to ~×0.25 … ×4). */
function pressureFactor(p) {
  const sens = prefs.pressure / 100;
  if (sens <= 0) return 1;
  const q = Math.min(1, Math.max(0, ((p ?? 0.5) - 0.1) / 0.8));
  const R = 1 + sens * 3;
  return Math.pow(R, 2 * q - 1);
}
function lineWidthFor(base, p) { return Math.max(0.6, base * pressureFactor(p)); }
function drawSegment(ctx, s, p0, p1, dx = 0, dy = 0) {
  ctx.strokeStyle = s.color;
  ctx.lineWidth = lineWidthFor(s.width, ((p0.p ?? 0.5) + (p1.p ?? 0.5)) / 2);
  ctx.beginPath();
  ctx.moveTo(p0.x + dx, p0.y + dy);
  ctx.lineTo(p1.x + dx, p1.y + dy);
  ctx.stroke();
}
function drawDot(ctx, s, p, dx = 0, dy = 0) {
  ctx.fillStyle = s.color;
  ctx.beginPath();
  ctx.arc(p.x + dx, p.y + dy, lineWidthFor(s.width, p.p) / 2, 0, Math.PI * 2);
  ctx.fill();
}
function drawHighlight(ctx, s, dx = 0, dy = 0) {
  ctx.save();
  ctx.globalAlpha = HL_ALPHA;
  ctx.strokeStyle = s.color;
  ctx.fillStyle = s.color;
  ctx.lineWidth = s.width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  if (s.points.length === 1) {
    ctx.arc(s.points[0].x + dx, s.points[0].y + dy, s.width / 2, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.moveTo(s.points[0].x + dx, s.points[0].y + dy);
    for (let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x + dx, s.points[i].y + dy);
    ctx.stroke();
  }
  ctx.restore();
}
function drawStrokes(ctx, list, dx = 0, dy = 0) {
  for (const s of list) if (s.hl && s.points.length) drawHighlight(ctx, s, dx, dy);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const s of list) {
    if (s.hl || !s.points.length) continue;
    if (s.points.length === 1) { drawDot(ctx, s, s.points[0], dx, dy); continue; }
    for (let i = 1; i < s.points.length; i++) drawSegment(ctx, s, s.points[i - 1], s.points[i], dx, dy);
  }
}
function dprOf() { return Math.min(window.devicePixelRatio || 1, 2); }

/** Render strokes tightly cropped on white, as base64 PNG (for AI). */
function renderPng(list) {
  const b = strokesBox(list);
  const pad = 16;
  const w = b.w + pad * 2, h = b.h + pad * 2;
  const scale = Math.min(2, 1600 / w, 900 / h);
  const c = document.createElement('canvas');
  c.width = Math.max(64, Math.ceil(w * scale));
  c.height = Math.max(64, Math.ceil(h * scale));
  const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF';
  x.fillRect(0, 0, c.width, c.height);
  x.scale(scale, scale);
  drawStrokes(x, list, pad - b.minX, pad - b.minY);
  return c.toDataURL('image/png').split(',')[1];
}

/* =========================================================
   Symbol classification & block splitting
   Rule: symbols live in the left margin (left of the red line).
   Each margin symbol starts a new note; text lines without a
   symbol continue the note above. Highlights are ignored for
   classification and attached to the note they cover.
   ========================================================= */
function classifySymbol(list) {
  if (!list.length) return null;
  const all = list.flatMap((s) => s.points);
  const b = getBox(all);
  const w = Math.max(1, b.w), h = Math.max(1, b.h);
  if (w / h < 0.38 || h / w < 0.38) return null; // a line, not a symbol

  const inCenter = all.filter((p) =>
    p.x > b.minX + w * 0.28 && p.x < b.maxX - w * 0.28 &&
    p.y > b.minY + h * 0.28 && p.y < b.maxY - h * 0.28).length;
  const centerRatio = inCenter / all.length;
  if (centerRatio > 0.12) return list.length === 2 ? 'idea' : null; // + (two crossing strokes)

  // △: bottom much wider than top
  const top = all.filter((p) => p.y < b.minY + h * 0.35);
  const bot = all.filter((p) => p.y > b.minY + h * 0.65);
  const span = (pts) => pts.length ? Math.max(...pts.map((p) => p.x)) - Math.min(...pts.map((p) => p.x)) : w;
  if (span(bot) > 1.7 * Math.max(4, span(top))) return 'ref';

  // □ / ○ / ◇: which outline fits best (square = L∞, circle = L2, diamond = L1)
  const cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2;
  let eSq = 0, eCi = 0, eDi = 0;
  for (const p of all) {
    const u = Math.abs((p.x - cx) / (w / 2)), v = Math.abs((p.y - cy) / (h / 2));
    eSq += Math.abs(Math.max(u, v) - 1);
    eCi += Math.abs(Math.hypot(u, v) - 1);
    eDi += Math.abs(u + v - 1);
  }
  if (eSq <= eCi && eSq <= eDi) return 'todo';
  return eDi < eCi ? 'decision' : 'fact';
}

function splitIntoBlocks(list, gap) {
  const highlights = [];
  const items = [];
  for (const s of list) {
    if (!s.points.length) continue;
    if (s.hl) { highlights.push(s); continue; }
    const b = getBox(s.points);
    items.push({ s, b, cx: (b.minX + b.maxX) / 2, cy: (b.minY + b.maxY) / 2 });
  }
  const marginItems = items.filter((i) => i.cx < MARGIN_X).sort((a, b) => a.b.minY - b.b.minY);
  const textItems = items.filter((i) => i.cx >= MARGIN_X);

  const clusters = [];
  for (const it of marginItems) {
    const c = clusters[clusters.length - 1];
    if (c && it.b.minY <= c.maxY + gap * 0.3) {
      c.items.push(it);
      c.minY = Math.min(c.minY, it.b.minY);
      c.maxY = Math.max(c.maxY, it.b.maxY);
    } else {
      clusters.push({ items: [it], minY: it.b.minY, maxY: it.b.maxY });
    }
  }

  const lines = new Map();
  const lineOf = (i) => { if (!lines.has(i)) lines.set(i, { sym: [], text: [] }); return lines.get(i); };
  for (const c of clusters) lineOf(Math.floor((c.minY + c.maxY) / 2 / gap)).sym.push(...c.items.map((i) => i.s));
  for (const tItem of textItems) lineOf(Math.floor(tItem.cy / gap)).text.push(tItem.s);

  const out = [];
  let lastLine = -99;
  for (const idx of [...lines.keys()].sort((a, b) => a - b)) {
    const ln = lines.get(idx);
    const tag = ln.sym.length ? classifySymbol(ln.sym) : null;
    const lineStrokes = [...ln.sym, ...ln.text];
    if (tag) {
      out.push({ tagType: tag, strokes: lineStrokes, first: idx, last: idx });
    } else if (out.length && idx - lastLine === 1) {
      const prev = out[out.length - 1];
      prev.strokes.push(...lineStrokes); // continuation line
      prev.last = idx;
    } else {
      out.push({ tagType: null, strokes: lineStrokes, first: idx, last: idx }); // after a blank line, no symbol -> new plain note
    }
    lastLine = idx;
  }

  // Attach each highlight to the note whose lines it covers (or the nearest one)
  for (const h of highlights) {
    const b = getBox(h.points);
    const line = Math.floor((b.minY + b.maxY) / 2 / gap);
    if (!out.length) { out.push({ tagType: null, strokes: [h], first: line, last: line }); continue; }
    let best = out[0], bestD = Infinity;
    for (const o of out) {
      const d = line < o.first ? o.first - line : line > o.last ? line - o.last : 0;
      if (d < bestD) { bestD = d; best = o; }
    }
    best.strokes.unshift(h);
  }
  return out;
}

/* =========================================================
   Writing canvas, divided into screen-sized pages.
   Strokes keep logical coordinates with pages stacked top to
   bottom (page k covers y = k*pageH ... (k+1)*pageH). In sideways
   mode the same pages are only laid out next to each other.
   ========================================================= */
const ink = $('#ink');
const ictx = ink.getContext('2d');
const scroller = $('#canvasScroll');
let strokes = [];          // never mutated in place except the stroke being drawn
let undoStack = [], redoStack = [];
const tool = { mode: 'pen', penColor: PEN_COLORS[0], hlColor: HL_COLORS[0], width: PEN_WIDTHS[1].w };
let active = null;         // { id, erase, stroke, before, page }
let touchNav = null;
let palmNoticeShown = false;
let pageW = 0, pageH = 0, pageCount = 1, curPage = 0;
let redrawQueued = false;
const horizontal = () => prefs.pageMode === 'h';

function pageOfY(y) { return pageH ? Math.max(0, Math.floor(y / pageH)) : 0; }
function strokePage(s) { return pageOfY(s.points[0].y); }
function lastContentPage() {
  let m = -1;
  for (const s of strokes) for (const p of s.points) { const k = pageOfY(p.y); if (k > m) m = k; }
  return m;
}
function pageOffset(k) { return horizontal() ? { dx: k * pageW, dy: -k * pageH } : { dx: 0, dy: 0 }; }

function layoutPages(force = false) {
  const w = scroller.clientWidth, hRaw = scroller.clientHeight;
  if (!w || !hRaw) return;
  const g = prefs.gap;
  const h = Math.max(g * 4, Math.floor(hRaw / g) * g);
  const sizeChanged = w !== pageW || h !== pageH;
  pageW = w; pageH = h;
  const count = Math.max(1, lastContentPage() + 2); // always one blank page after the last written one
  if (!force && !sizeChanged && count === pageCount) return;
  pageCount = count;
  const cw = horizontal() ? w * count : w;
  const ch = horizontal() ? h : h * count;
  const dpr = dprOf();
  ink.width = Math.round(cw * dpr);
  ink.height = Math.round(ch * dpr);
  ink.style.width = cw + 'px';
  ink.style.height = ch + 'px';
  ink.style.setProperty('--page-w', w + 'px');
  ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
  $('#pageSnaps').innerHTML = Array.from({ length: count }, (_, k) => horizontal()
    ? `<i style="left:${k * w}px;top:0;width:${w}px;height:${h}px"></i>`
    : `<i style="left:0;top:${k * h}px;width:${w}px;height:${h}px"></i>`).join('');
  redraw();
  if (curPage > count - 1) curPage = count - 1;
  if (sizeChanged || force) goToPage(curPage, false);
  updatePageNav();
}
function sizeInk() { layoutPages(); }

function redraw() {
  const cw = horizontal() ? pageW * pageCount : pageW;
  const ch = horizontal() ? pageH : pageH * pageCount;
  ictx.clearRect(0, 0, cw, ch);
  // page breaks
  ictx.save();
  ictx.strokeStyle = '#D6CBB4';
  ictx.lineWidth = 1;
  ictx.setLineDash([6, 5]);
  for (let k = 1; k < pageCount; k++) {
    ictx.beginPath();
    if (horizontal()) { ictx.moveTo(k * pageW + 0.5, 0); ictx.lineTo(k * pageW + 0.5, ch); }
    else { ictx.moveTo(0, k * pageH + 0.5); ictx.lineTo(cw, k * pageH + 0.5); }
    ictx.stroke();
  }
  ictx.restore();
  if (!horizontal()) { drawStrokes(ictx, strokes); return; }
  const byPage = new Map();
  for (const s of strokes) {
    if (!s.points.length) continue;
    const k = strokePage(s);
    if (!byPage.has(k)) byPage.set(k, []);
    byPage.get(k).push(s);
  }
  for (const [k, list] of byPage) { const o = pageOffset(k); drawStrokes(ictx, list, o.dx, o.dy); }
}
function queueRedraw() {
  if (redrawQueued) return;
  redrawQueued = true;
  requestAnimationFrame(() => { redrawQueued = false; redraw(); });
}
function hlWidth() { return Math.round(prefs.gap * 0.55); }

/** Page under the pointer, from screen position. */
function pageAt(e) {
  const r = ink.getBoundingClientRect();
  const k = horizontal() ? Math.floor((e.clientX - r.left) / pageW) : Math.floor((e.clientY - r.top) / pageH);
  return Math.min(pageCount - 1, Math.max(0, k));
}
/** Logical point for a pointer event on page k, kept inside that page. */
function posOnPage(e, k) {
  const r = ink.getBoundingClientRect();
  let x = e.clientX - r.left, y = e.clientY - r.top;
  if (horizontal()) { x -= k * pageW; y += k * pageH; }
  return {
    x: Math.min(pageW - 1, Math.max(0, x)),
    y: Math.min((k + 1) * pageH - 1, Math.max(k * pageH, y)),
    p: e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5
  };
}

/* ----- page navigation ----- */
function goToPage(k, smooth = true) {
  curPage = Math.min(pageCount - 1, Math.max(0, k));
  scroller.scrollTo({ left: horizontal() ? curPage * pageW : 0, top: horizontal() ? 0 : curPage * pageH, behavior: smooth ? 'smooth' : 'auto' });
  updatePageNav();
}
function updatePageNav() {
  $('#pageLabel').textContent = `${curPage + 1} / ${pageCount}`;
  $('#prevPageBtn').disabled = curPage <= 0;
  $('#nextPageBtn').disabled = curPage >= pageCount - 1;
}
scroller.addEventListener('scroll', () => {
  if (touchNav || !pageW || !pageH) return;
  const k = horizontal() ? Math.round(scroller.scrollLeft / pageW) : Math.round(scroller.scrollTop / pageH);
  if (k !== curPage) { curPage = Math.min(pageCount - 1, Math.max(0, k)); updatePageNav(); }
});
let wheelLock = 0;
scroller.addEventListener('wheel', (e) => {
  if (!horizontal() || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault();
  const now = Date.now();
  if (now < wheelLock) return;
  wheelLock = now + 450;
  goToPage(curPage + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });
$('#prevPageBtn').addEventListener('click', () => goToPage(curPage - 1));
$('#nextPageBtn').addEventListener('click', () => goToPage(curPage + 1));

function setPageMode(mode) {
  prefs.pageMode = mode === 'h' ? 'h' : 'v';
  lsSet('cronota_page_mode', prefs.pageMode);
  scroller.classList.toggle('h', horizontal());
  $('#pageHBtn').setAttribute('aria-pressed', String(horizontal()));
  $('#pageVBtn').setAttribute('aria-pressed', String(!horizontal()));
  $('#prevPageBtn').innerHTML = icon(horizontal() ? 'chevLeft' : 'chevUp', 'sm');
  $('#nextPageBtn').innerHTML = icon(horizontal() ? 'chevRight' : 'chevron', 'sm');
  $('#nPrevBtn').innerHTML = icon(horizontal() ? 'chevLeft' : 'chevUp', 'sm');
  $('#nNextBtn').innerHTML = icon(horizontal() ? 'chevRight' : 'chevron', 'sm');
  layoutPages(true);
  nPage = 0;
  renderNotes();
}
$('#pageHBtn').addEventListener('click', () => setPageMode('h'));
$('#pageVBtn').addEventListener('click', () => setPageMode('v'));

/* ----- history ----- */
function pushHistory() {
  undoStack.push(strokes);
  if (undoStack.length > 200) undoStack.shift();
  redoStack = [];
}
function afterCanvasChange() {
  $('#undoBtn').disabled = !undoStack.length;
  $('#redoBtn').disabled = !redoStack.length;
  $('#clearBtn').disabled = !strokes.length;
  updateStatus();
}
function undo() {
  if (!undoStack.length || active) return;
  redoStack.push(strokes);
  strokes = undoStack.pop();
  layoutPages(); redraw(); afterCanvasChange();
}
function redo() {
  if (!redoStack.length || active) return;
  undoStack.push(strokes);
  strokes = redoStack.pop();
  layoutPages(); redraw(); afterCanvasChange();
}
function clearCanvas() {
  if (!strokes.length) return;
  pushHistory();
  strokes = [];
  layoutPages(); redraw(); afterCanvasChange();
  goToPage(0);
  toast(t('cleared'), { label: t('undoBtn'), run: undo });
}

function eraseAt(pt, radius = 12) {
  let changed = false;
  const next = [];
  for (const s of strokes) {
    const r = s.hl ? radius + s.width / 2 : radius;
    if (!s.points.some((p) => Math.hypot(p.x - pt.x, p.y - pt.y) <= r)) { next.push(s); continue; }
    changed = true;
    let seg = [];
    for (const p of s.points) {
      if (Math.hypot(p.x - pt.x, p.y - pt.y) <= r) {
        if (seg.length >= 2) next.push({ ...s, points: seg });
        seg = [];
      } else seg.push(p);
    }
    if (seg.length >= 2) next.push({ ...s, points: seg });
  }
  if (changed) { strokes = next; redraw(); }
}

/* ----- pointer input ----- */
ink.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch' && prefs.penOnly) {
    // pen-only: a finger turns pages instead of drawing
    if (!touchNav) {
      touchNav = { id: e.pointerId, x: e.clientX, y: e.clientY, left: scroller.scrollLeft, top: scroller.scrollTop, start: curPage };
      scroller.style.scrollSnapType = 'none';
    }
    if (!palmNoticeShown) { palmNoticeShown = true; toast(t('palm')); }
    return;
  }
  if (active || e.button > 0) return;
  e.preventDefault();
  try { ink.setPointerCapture(e.pointerId); } catch {}
  const page = pageAt(e);
  const pt = posOnPage(e, page);
  const before = strokes;
  pushHistory();
  if (tool.mode === 'eraser') {
    active = { id: e.pointerId, erase: true, before, page };
    eraseAt(pt);
    return;
  }
  const s = tool.mode === 'hl'
    ? { color: tool.hlColor, width: hlWidth(), points: [pt], hl: true }
    : { color: tool.penColor, width: tool.width, points: [pt] };
  strokes = [...strokes, s];
  active = { id: e.pointerId, stroke: s, before, page };
  if (s.hl) queueRedraw();
  else { const o = pageOffset(page); ictx.lineCap = 'round'; ictx.lineJoin = 'round'; drawDot(ictx, s, pt, o.dx, o.dy); }
});

ink.addEventListener('pointermove', (e) => {
  if (touchNav && e.pointerId === touchNav.id) {
    if (horizontal()) scroller.scrollLeft = touchNav.left - (e.clientX - touchNav.x);
    else scroller.scrollTop = touchNav.top - (e.clientY - touchNav.y);
    return;
  }
  if (!active || e.pointerId !== active.id) return;
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if (!evs || !evs.length) evs = [e];
  const o = pageOffset(active.page);
  for (const ce of evs) {
    const pt = posOnPage(ce, active.page);
    if (active.erase) { eraseAt(pt); continue; }
    const s = active.stroke;
    const prev = s.points[s.points.length - 1];
    if (Math.hypot(pt.x - prev.x, pt.y - prev.y) >= 1.2) {
      s.points.push(pt);
      if (!s.hl) drawSegment(ictx, s, prev, pt, o.dx, o.dy);
    }
  }
  if (!active.erase && active.stroke.hl) queueRedraw(); // keeps the highlight under the ink
});

function endPointer(e) {
  if (touchNav && e.pointerId === touchNav.id) {
    const d = horizontal() ? e.clientX - touchNav.x : e.clientY - touchNav.y;
    const size = horizontal() ? pageW : pageH;
    let k = touchNav.start;
    if (Math.abs(d) > Math.min(60, size * 0.15)) k += d < 0 ? 1 : -1;
    touchNav = null;
    goToPage(k);
    setTimeout(() => { scroller.style.scrollSnapType = ''; }, 450);
    return;
  }
  if (!active || e.pointerId !== active.id) return;
  const unchanged = strokes === active.before;
  active = null;
  if (unchanged) undoStack.pop();
  layoutPages(); // adds a fresh blank page after the last written one
  afterCanvasChange();
}
ink.addEventListener('pointerup', endPointer);
ink.addEventListener('pointercancel', endPointer);
ink.addEventListener('lostpointercapture', endPointer);

/* ----- Save button label (number of notes the canvas will become) ----- */
function updateStatus() {

/* ----- Save ----- */
let saving = false;

/* ----- Re-open a saved note on the writing page (add highlights, underlines, more ink) ----- */
let editNoteId = null;
function openNoteForEditing(b) {
  if (active || saving) return;
  if (editNoteId === b.id) { setTab('write'); return; }
  if (strokes.length) { toast(t('saveFirst')); return; }
  const g = b.gap, k = prefs.gap / g;
  const box = strokesBox(b.strokes);
  const top = Math.floor(Math.max(0, box.minY) / g) * g;
  strokes = b.strokes.map((s) => ({ ...s, points: s.points.map((p) => ({ x: Math.round(p.x * k * 10) / 10, y: Math.round(((p.y - top) * k + prefs.gap) * 10) / 10, p: p.p })) }));
  undoStack = []; redoStack = [];
  editNoteId = b.id;
  selectedId = null; editingId = null;
  setTab('write');
  layoutPages(true); redraw(); afterCanvasChange();
  goToPage(0, false);
  renderNotes();
}
function endNoteEditing() {
  editNoteId = null;
  strokes = []; undoStack = []; redoStack = [];
  layoutPages(true); redraw(); afterCanvasChange();
  goToPage(0, false);
  renderNotes();
}
$('#cancelEditBtn').addEventListener('click', () => { if (!active && !saving) endNoteEditing(); });
function saveEditedNote() {
  const parts = splitIntoBlocks(strokes, prefs.gap);
  if (!parts.length) { toast(t('writeFirst')); return; }
  const fresh = sanitizeBlock({ gap: prefs.gap, strokes });
  let b = blocks.find((x) => x.id === editNoteId);
  if (!b) { // deleted while editing: keep it as a new note
    b = sanitizeBlock({ id: editNoteId, tagType: parts[0].tagType || 'none', tagSource: parts[0].tagType ? 'symbol' : 'auto', createdAt: new Date().toISOString(), gap: prefs.gap, strokes });
    blocks.unshift(b);
  }
  b.strokes = fresh.strokes;
  b.gap = prefs.gap;
  b.priority = b.strokes.some((s) => !s.hl && s.color === HIGH_COLOR) ? 'high' : 'normal';
  const sym = parts.find((p) => p.tagType);
  if (b.tagSource === 'symbol' && sym) b.tagType = sym.tagType;
  persist();
  endNoteEditing();
  renderKeywordChips();
  toast(t('updated'));
}

async function saveCanvas() {
  if (saving || active) return;
  if (editNoteId) { saveEditedNote(); return; }
  const parts = splitIntoBlocks(strokes, prefs.gap);
  if (!parts.length) { toast(t('writeFirst')); return; }

  // Take exactly these strokes off the canvas right away, so anything
  // written while the AI is working stays on the canvas.
  const taken = new Set(parts.flatMap((p) => p.strokes));
  strokes = strokes.filter((s) => !taken.has(s));
  undoStack = []; redoStack = [];
  sizeInk(); redraw();

  const base = Date.now();
  const created = parts.map((p, i) => sanitizeBlock({
    id: uid(),
    tagType: p.tagType || 'none',
    tagSource: p.tagType ? 'symbol' : 'auto',
    status: 'open',
    priority: p.strokes.some((s) => !s.hl && s.color === HIGH_COLOR) ? 'high' : 'normal',
    createdAt: new Date(base).toISOString(), pos: i, // notes saved together share a time; pos keeps top-to-bottom order
    text: '', keywords: [], gap: prefs.gap,
    strokes: p.strokes
  }));
  blocks.unshift(...created);
  persist();
  renderNotes();
  renderKeywordChips();
  toast(t('saved', { n: created.length, list: created.map((b) => tagName(b.tagType)).join(', ') }));

  if (!prefs.key) { afterCanvasChange(); return; }

  saving = true;
  afterCanvasChange();
  let failed = null;
  await Promise.all(created.map(async (b) => {
    try {
      const r = await analyzeInk(b.strokes.filter((s) => !s.hl));
      const live = blocks.find((x) => x.id === b.id);
      if (!live) return; // deleted meanwhile
      if (!live.text && r.text) live.text = r.text;
      if (!live.keywords.length) live.keywords = r.keywords;
      if (live.tagSource === 'auto' && r.tagType) { live.tagType = r.tagType; live.tagSource = 'ai'; }
    } catch (err) { failed = err; }
  }));
  saving = false;
  persist();
  renderNotes();
  renderKeywordChips();
  afterCanvasChange();
  if (failed) toast(t('aiFail', { msg: aiErrorMessage(failed) }));
}

/* =========================================================
   Gemini
   ========================================================= */
async function gemini(parts, { json = false, model = prefs.model, key = prefs.key } = {}) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const body = { contents: [{ parts }] };
  if (json) body.generationConfig = { responseMimeType: 'application/json' };
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = new Error('HTTP ' + res.status);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  const out = data?.candidates?.[0]?.content?.parts;
  return Array.isArray(out) ? out.map((p) => (typeof p?.text === 'string' ? p.text : '')).join('') : '';
}
function aiErrorMessage(e) {
  if (e.status === 400 || e.status === 401 || e.status === 403) return t('errKey');
  if (e.status === 404) return t('errModel');
  if (e.status === 429) return t('errQuota');
  if (e.status >= 500) return t('errServer');
  if (e instanceof SyntaxError) return t('errParse');
  return t('errNet');
}
function parseJsonLoose(raw) {
  const cleaned = String(raw).replace(/```json|```/gi, '').trim();
  try { return JSON.parse(cleaned); } catch {}
  const m = cleaned.match(/\{[\s\S]*\}/);
  return m ? JSON.parse(m[0]) : {};
}
async function analyzeInk(list) {
  const prompt = 'This is a handwritten note. Read the first symbol on the left (□=todo, ○=fact, △=ref, +=idea, ◇=decision, none if there is no symbol) and the handwriting. ' +
    'Reply with JSON only: {"tagType":"todo|fact|ref|idea|decision|none","text":"all handwriting except the symbol, in the language it was written in","keywords":["3-6 search keywords in the same language"]}';
  const raw = await gemini([{ text: prompt }, { inline_data: { mime_type: 'image/png', data: renderPng(list) } }], { json: true });
  const obj = parseJsonLoose(raw) || {};
  return {
    tagType: TAGS[obj.tagType] && obj.tagType !== 'none' ? obj.tagType : null,
    text: toStr(obj.text ?? obj.ocrText).trim(),
    keywords: toKeywords(obj.keywords)
  };
}

/* =========================================================
   Notes: one continuous page
   ========================================================= */
let filter = 'all';      // 'all' | tag key
let query = '';
let editingId = null;
let selectedId = null;

function matchesQuery(b, q) {
  return b.text.toLowerCase().includes(q) ||
    b.keywords.some((k) => k.toLowerCase().includes(q)) ||
    Object.values(I18N).some((L) => L.tags[b.tagType].toLowerCase().includes(q));
}
function sortKey(b) {
  const t = Date.parse(b.createdAt) || 0;
  if (Number.isInteger(b.pos)) return { t, pos: b.pos };
  // older notes: one save used times base, base-1ms, base-2ms... from the top down
  return { t: Math.floor(t / 1000) * 1000, pos: -(t % 1000) };
}
function visibleBlocks() {
  let list = blocks;
  if (filter !== 'all') list = list.filter((b) => b.tagType === filter);
  const q = query.trim().toLowerCase();
  if (q) list = list.filter((b) => matchesQuery(b, q));
  return [...list].sort((a, b) => {
    // Newest/oldest first by the time a note was first saved (re-editing never
    // changes it). Notes saved together stay in reading order in both directions.
    const ka = sortKey(a), kb = sortKey(b);
    const d = prefs.sortDesc ? kb.t - ka.t : ka.t - kb.t;
    return d || (ka.pos - kb.pos) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  });
}

function renderFilters() {
  const counts = Object.fromEntries(TAG_KEYS.map((k) => [k, 0]));

    TAG_KEYS.map((k) =>
      `<button class="chip" data-filter="${k}" style="--c:${TAGS[k].color}" aria-pressed="${filter === k}">${TAGS[k].symbol ? `<b>${TAGS[k].symbol}</b>` : ''}${escapeHtml(tagLabel(k))}${counts[k] ? ` <span class="n">${counts[k]}</span>` : ''}</button>`).join('');
  $('#mtabCount').textContent = blocks.length ? `(${blocks.length})` : '';

function dayLabel(iso) {

  const y = new Date(now); y.setDate(now.getDate() - 1);
  const opts = { month: 'long', day: 'numeric', weekday: 'short' };
  if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
  const base = new Intl.DateTimeFormat(t('locale'), opts).format(d);
  if (d.toDateString() === now.toDateString()) return t('today') + ' · ' + base;
  if (d.toDateString() === y.toDateString()) return t('yesterday') + ' · ' + base;
  return base;
}

function noteHtml(b, inSearch) {
