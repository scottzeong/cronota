/** Draw a note as a slice of lined paper: one blank line on top, then its ink rows. */
function drawNoteInk(canvas, b, width) {
  // Every note is drawn on the same ruling as the page: the current line gap and
  // the red margin at MARGIN_X, so lines and the margin run straight down the page.
  const G = prefs.gap, s0 = G / b.gap;
  const box0 = strokesBox(b.strokes);
  const top = Math.floor(Math.max(0, box0.minY) / b.gap) * b.gap;
  const offY = G - top * s0;
  const pts = (st, f) => ({ ...st, width: st.width * f.w, points: st.points.map(f.p) });
  let list = b.strokes.map((st) => pts(st, { w: s0, p: (p) => ({ x: p.x * s0, y: p.y * s0 + offY, p: p.p }) }));
  // Notes written on a wider screen: shrink only the writing right of the margin,
  // each line around its own middle, so symbols, margin and lines stay put.
  const textW = Math.max(...list.filter((st) => !isMarginStroke(st)).flatMap((st) => st.points.map((p) => p.x)), MARGIN_X) + 16;
  const k = Math.min(1, (width - MARGIN_X) / Math.max(1, textW - MARGIN_X));
  if (k < 1) {
    list = list.map((st) => {
      if (isMarginStroke(st)) return st;
      const yb = getBox(st.points);
      const mid = Math.floor((yb.minY + yb.maxY) / 2 / G) * G + G / 2;
      return pts(st, { w: k, p: (p) => ({ x: MARGIN_X + (p.x - MARGIN_X) * k, y: mid + (p.y - mid) * k, p: p.p }) });
    });
  }
  const box = strokesBox(list);
  const h = Math.max(G, Math.ceil((box.maxY + 6) / G) * G);
  const w = Math.max(1, Math.floor(width));
  const dpr = dprOf();
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.style.removeProperty('--gap');
  canvas.style.removeProperty('--margin-x');
  const c = canvas.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawStrokes(c, list, 0, 0);
}
function isMarginStroke(st) {
  if (st.hl) return false;
  const bx = getBox(st.points);
  return (bx.minX + bx.maxX) / 2 < MARGIN_X;
}

function renderNotes() {
  renderFilters();
  const listEl = $('#list');
  const q = query.trim().toLowerCase();
  const list = visibleBlocks();

  $('#banner').classList.toggle('show', !!q);
  $('#bannerText').textContent = q ? t('results', { q: query.trim(), n: list.length }) : '';

  if (!list.length) {
    listEl.classList.remove('paged', 'h');
    nPageCount = 0; updateNotesNav();
    listEl.innerHTML = blocks.length === 0
      ? `<div class="empty"><b>${escapeHtml(t('emptyNone'))}</b>${escapeHtml(t('emptyNoneSub'))}</div>`
      : q ? `<div class="empty"><b>${escapeHtml(t('emptySearch'))}</b>${escapeHtml(t('emptySearchSub'))}</div>`
          : `<div class="empty"><b>${escapeHtml(t('emptyFilter'))}</b></div>`;
    return;
  }
  listEl.classList.remove('paged', 'h'); // measure notes in the plain one-column layout first
  let html = '<div class="page"><div class="page-scroll">';
  let lastDay = '';
  for (const b of list) {
    if (q) {
      const day = dayLabel(b.createdAt);
      if (day !== lastDay) { html += `<div class="day-head">${escapeHtml(day)}</div>`; lastDay = day; }
    }
    html += noteHtml(b, !!q);
  }
  html += '<div class="paper page-end"></div></div></div>';
  listEl.innerHTML = html;

  const scrollEl = listEl.querySelector('.page-scroll');
  const baseW = scrollEl.clientWidth;
  const byId = new Map(list.map((b) => [b.id, b]));
  scrollEl.querySelectorAll('.pnote').forEach((el) => {
    const b = byId.get(el.dataset.id);
    if (b) drawNoteInk(el.querySelector('canvas[data-ink]'), b, baseW);
  });
  if (listEl.clientWidth && listEl.clientHeight) paginateNotes(listEl);
  else { listEl.classList.remove('paged', 'h'); nPageCount = 0; updateNotesNav(); }
  const input = listEl.querySelector('[data-edit-input]');
  if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}

/* Notes are shown as screen-sized pages too, turned the same way as the writing
   page (up/down or sideways). Notes are packed whole; a note taller than a page
   gets a page of its own. */
let nPage = 0, nPageCount = 0, nPageW = 0, nPageH = 0, nScrollLock = false;
function paginateNotes(listEl) {
  const cs = getComputedStyle(listEl);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const w = listEl.clientWidth - padX;
  const h = Math.max(160, listEl.clientHeight - padY);
  const src = listEl.querySelector('.page-scroll');
  const items = [...src.children].filter((el) => !el.classList.contains('page-end'));
  const pages = [];
  let cur = null, used = 0;
  for (const el of items) {
    const eh = el.offsetHeight;
    if (!cur || (used + eh > h && used > 0)) { cur = []; pages.push(cur); used = 0; }
    cur.push(el); used += eh;
  }
  const frag = document.createDocumentFragment();
  for (const group of pages) {
    const pg = document.createElement('div');
    pg.className = 'page npage';
    pg.style.width = w + 'px';
    pg.style.minHeight = h + 'px';
    pg.append(...group);
    const fill = document.createElement('div');
    fill.className = 'paper fill';
    pg.append(fill);
    frag.append(pg);
  }
  listEl.classList.add('paged');
  listEl.classList.toggle('h', horizontal());
  listEl.replaceChildren(frag);
  nPageW = w; nPageH = h; nPageCount = pages.length;
  // stay on the page being looked at (or the one holding the selected note)
  let k = Math.min(nPage, nPageCount - 1);
  const want = selectedId || editingId;
  if (want) {
    const at = [...listEl.children].findIndex((pg) => pg.querySelector(`.pnote[data-id="${CSS.escape(want)}"]`));
    if (at >= 0) k = at;
  }
  goToNotesPage(k, false);
}
function notesStep() { return (horizontal() ? nPageW : nPageH) + 14; }
function goToNotesPage(k, smooth = true) {
  const listEl = $('#list');
  nPage = Math.min(Math.max(0, nPageCount - 1), Math.max(0, k));
  const pg = listEl.children[nPage];
  if (pg && pg.classList.contains('npage')) {
    nScrollLock = true;
    listEl.scrollTo({ left: horizontal() ? pg.offsetLeft - 14 : 0, top: horizontal() ? 0 : pg.offsetTop - 14, behavior: smooth ? 'smooth' : 'auto' });
    setTimeout(() => { nScrollLock = false; }, smooth ? 500 : 50);
  }
  updateNotesNav();
}
function updateNotesNav() {
  $('#notesNav').hidden = nPageCount < 1;
  $('#nPageLabel').textContent = `${Math.min(nPage + 1, nPageCount)} / ${nPageCount}`;
  $('#nPrevBtn').disabled = nPage <= 0;
  $('#nNextBtn').disabled = nPage >= nPageCount - 1;
}
$('#list').addEventListener('scroll', (e) => {
  if (nScrollLock || !nPageCount || e.target !== $('#list')) return;
  const el = $('#list');
  const k = Math.round((horizontal() ? el.scrollLeft : el.scrollTop) / notesStep());
  if (k !== nPage) { nPage = Math.min(nPageCount - 1, Math.max(0, k)); updateNotesNav(); }
});
let nWheelLock = 0;
$('#list').addEventListener('wheel', (e) => {
  if (!horizontal() || !nPageCount || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault();
  const now = Date.now();
  if (now < nWheelLock) return;
  nWheelLock = now + 450;
  goToNotesPage(nPage + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });
$('#nPrevBtn').addEventListener('click', () => goToNotesPage(nPage - 1));
$('#nNextBtn').addEventListener('click', () => goToNotesPage(nPage + 1));

function findBlock(el) {
  const n = el.closest('.pnote');
  return n ? blocks.find((b) => b.id === n.dataset.id) : null;
}
function saveEdit(input) {
  const b = blocks.find((x) => x.id === editingId);
  editingId = null;
  if (b) { b.text = toStr(input.value).trim(); persist(); }
  renderNotes();
}

$('#list').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) {
    if (e.target.closest('.edit-row, .note-actions')) return;
    const note = e.target.closest('.pnote');
    const id = note ? note.dataset.id : null;
    selectedId = selectedId === id ? null : id;
    if (editingId && editingId !== selectedId) editingId = null;
    renderNotes();
    return;
  }
  if (btn.tagName === 'SELECT') return;
  const b = findBlock(btn);
  if (!b) return;
  const act = btn.dataset.act;
  if (act === 'done') {
    b.status = b.status === 'done' ? 'open' : 'done';
    persist(); renderNotes();
  } else if (act === 'delete') {
    const idx = blocks.indexOf(b);
    blocks.splice(idx, 1);
    selectedId = null; editingId = null;
    persist(); renderNotes(); renderKeywordChips();
    toast(t('deleted'), { label: t('undoBtn'), run: () => {
      blocks.splice(Math.min(idx, blocks.length), 0, b);
      persist(); renderNotes(); renderKeywordChips();
    } });
  } else if (act === 'reedit') {
    openNoteForEditing(b);
  } else if (act === 'edit') {
    editingId = editingId === b.id ? null : b.id;
    renderNotes();
  } else if (act === 'edit-save') {
    saveEdit(btn.parentElement.querySelector('[data-edit-input]'));
  }
});
$('#list').addEventListener('change', (e) => {
  if (e.target.dataset.act !== 'tag') return;
  const b = findBlock(e.target);
  if (!b || !TAGS[e.target.value]) return;
  b.tagType = e.target.value;
  b.tagSource = 'user';
  if (!TAGS[b.tagType].canDone) b.status = 'open';
  persist(); renderNotes();
});
$('#list').addEventListener('keydown', (e) => {
  if (!e.target.matches('[data-edit-input]')) return;
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); saveEdit(e.target); }
  if (e.key === 'Escape') { editingId = null; renderNotes(); }
});

/* =========================================================
   Search & handwriting search pad
   ========================================================= */
const searchInput = $('#searchInput');
function setQuery(q) {
  query = q;
  searchInput.value = q;
  $('#clearSearchBtn').hidden = !q;
  selectedId = null; editingId = null; nPage = 0;
  if (q.trim()) setTab('notes');
  renderNotes();
}
searchInput.addEventListener('input', () => setQuery(searchInput.value));
$('#clearSearchBtn').addEventListener('click', () => { setQuery(''); searchInput.focus(); });
$('#bannerClear').addEventListener('click', () => setQuery(''));

const pad = $('#padCanvas');
const pctx = pad.getContext('2d');
let padStrokes = [];
let padActive = null;
function sizePad() {
  const r = pad.getBoundingClientRect();
  if (!r.width) return;
  const dpr = dprOf();
  pad.width = Math.round(r.width * dpr);
  pad.height = Math.round(r.height * dpr);
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pctx.clearRect(0, 0, r.width, r.height);
  drawStrokes(pctx, padStrokes);
}
function padIsOpen() { return $('#padPop').classList.contains('open'); }
function openPad(open) {
  $('#padPop').classList.toggle('open', open);
  $('#padToggleBtn').setAttribute('aria-pressed', String(open));
  $('#padToggleBtn').setAttribute('aria-expanded', String(open));
  if (open) {
    $('#padNote').textContent = prefs.key ? t('padNote') : t('padNoteNoAi');
    renderKeywordChips();
    requestAnimationFrame(sizePad);
  }
}
function renderKeywordChips() {
  const freq = new Map();
  for (const b of blocks) for (const k of b.keywords) freq.set(k, (freq.get(k) || 0) + 1);
  const top = [...freq.entries()].sort((a, b) => b[1] - a[1]).slice(0, 14).map(([k]) => k);
  $('#kwRow').innerHTML = top.length
    ? `<span class="muted">${escapeHtml(t('kwTop'))}</span>` + top.map((k) => `<button class="kw-chip" data-kw="${escapeHtml(k)}">#${escapeHtml(k)}</button>`).join('')
    : `<span class="muted">${escapeHtml(t('kwNone'))}</span>`;
}
$('#padToggleBtn').addEventListener('click', () => openPad(!padIsOpen()));
$('#kwRow').addEventListener('click', (e) => {
  const b = e.target.closest('[data-kw]');
  if (!b) return;
  setQuery(b.dataset.kw);
  openPad(false);
});
$('#padClearBtn').addEventListener('click', () => { padStrokes = []; sizePad(); });
document.addEventListener('pointerdown', (e) => {
  if (padIsOpen() && !e.target.closest('#searchBox')) openPad(false);
});

pad.addEventListener('pointerdown', (e) => {
  if ((e.pointerType === 'touch' && prefs.penOnly) || padActive) return;
  e.preventDefault();
  try { pad.setPointerCapture(e.pointerId); } catch {}
  const r = pad.getBoundingClientRect();
  const s = { color: '#1E293B', width: 2.6, points: [{ x: e.clientX - r.left, y: e.clientY - r.top, p: e.pointerType === 'pen' ? (e.pressure || 0.5) : 0.5 }] };
  padStrokes.push(s);
  padActive = { id: e.pointerId, s };
  pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  drawDot(pctx, s, s.points[0]);
});
pad.addEventListener('pointermove', (e) => {
  if (!padActive || e.pointerId !== padActive.id) return;
  const r = pad.getBoundingClientRect();
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if (!evs || !evs.length) evs = [e];
  for (const ce of evs) {
    const pt = { x: ce.clientX - r.left, y: ce.clientY - r.top, p: ce.pointerType === 'pen' ? (ce.pressure || 0.5) : 0.5 };
    const s = padActive.s, prev = s.points[s.points.length - 1];
    if (Math.hypot(pt.x - prev.x, pt.y - prev.y) >= 1.2) { s.points.push(pt); drawSegment(pctx, s, prev, pt); }
  }
});
const endPad = (e) => { if (padActive && e.pointerId === padActive.id) padActive = null; };
pad.addEventListener('pointerup', endPad);
pad.addEventListener('pointercancel', endPad);

$('#padRunBtn').addEventListener('click', async () => {
  if (!padStrokes.length) { toast(t('padWriteFirst')); return; }
  if (!prefs.key) { toast(t('padNeedAi')); return; }
  const btn = $('#padRunBtn');
  btn.disabled = true;
  try {
    const raw = await gemini([
      { text: 'Output only the search word written in this handwriting image, in its original language. No other text.' },
      { inline_data: { mime_type: 'image/png', data: renderPng(padStrokes) } }
    ]);
    const text = raw.trim().split('\n')[0].replace(/^["'“”「」]+|["'“”「」]+$/g, '').slice(0, 60);
    if (text) {
      padStrokes = []; sizePad();
      openPad(false);
      setQuery(text);
      toast(t('padSearched', { q: text }));
    } else {
      toast(t('padUnreadable'));
    }
  } catch (err) {
    toast(t('padFail', { msg: aiErrorMessage(err) }));
  } finally {
    btn.disabled = false;
  }
});

/* =========================================================
   Toolbar
   ========================================================= */
/** Diameter a pen actually draws at normal pressure, so the toolbar dot matches the ink. */
function realDot(w) { return Math.max(2, Math.round(lineWidthFor(w, 0.5) * 10) / 10); }
function buildToolbar() {
  $('#penBtns').innerHTML = PEN_COLORS.map((c, i) =>
    `<button class="swatch" data-pen="${c}" style="--c:${c}" title="${escapeHtml(t('pens')[i])}" aria-label="${escapeHtml(t('pens')[i])}"><span></span></button>`).join('');
  $('#hlBtns').innerHTML = HL_COLORS.map((c, i) =>
    `<button class="swatch hl" data-hl="${c}" style="--c:${c}" title="${escapeHtml(t('hls')[i])}" aria-label="${escapeHtml(t('hls')[i])}"><span></span></button>`).join('');
  $('#widthBtns').innerHTML = PEN_WIDTHS.map((p, i) =>
    `<button class="wbtn" data-width="${p.w}" title="${escapeHtml(t('widths')[i])}" aria-label="${escapeHtml(t('widths')[i])}"><span style="width:${realDot(p.w)}px;height:${realDot(p.w)}px"></span></button>`).join('');
  syncToolbar();
}
function syncToolbar() {
  document.querySelectorAll('[data-pen]').forEach((x) => x.setAttribute('aria-pressed', String(tool.mode === 'pen' && x.dataset.pen === tool.penColor)));
  document.querySelectorAll('[data-hl]').forEach((x) => x.setAttribute('aria-pressed', String(tool.mode === 'hl' && x.dataset.hl === tool.hlColor)));
  document.querySelectorAll('[data-width]').forEach((x) => x.setAttribute('aria-pressed', String(+x.dataset.width === tool.width)));
  $('#eraserBtn').setAttribute('aria-pressed', String(tool.mode === 'eraser'));
  ink.classList.toggle('erasing', tool.mode === 'eraser');
}
function setMode(mode) { tool.mode = mode; syncToolbar(); }
function setPenOnly(on) {
  prefs.penOnly = on;
  lsSet('cronota_pen_only', on ? '1' : '0');
  const b = $('#penModeBtn');
  b.classList.toggle('on', on);
  b.classList.toggle('off', !on);
  b.title = on ? t('penOnlyOn') : t('penOnlyOff');
  b.setAttribute('aria-label', b.title);
  b.setAttribute('aria-pressed', String(on));
  $('#fingerCheck').checked = !on;
}

/* mobile tabs */
function setTab(tab) {
  if (document.body.dataset.tab === tab) return;
  document.body.dataset.tab = tab;
  document.querySelectorAll('.mtab').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.tab === tab)));
  requestAnimationFrame(() => { sizeInk(); if (tab === 'notes') renderNotes(); });
}
document.querySelectorAll('.mtab').forEach((x) => x.addEventListener('click', () => setTab(x.dataset.tab)));

/* Layout: writing and notes side by side, or one at a time with tabs.
   Phones always use tabs. Touch/pen tablets default to tabs, desktops to side by
   side; the header button switches it and the choice is remembered. */
const WIDE_MIN = 900;
function isTouchTablet() {
  const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  return matchMedia('(pointer: coarse)').matches || (navigator.maxTouchPoints > 1 && !fine);
}
function wantSplit() {
  const v = lsGet('cronota_layout', '');
  if (v === 'split') return true;
  if (v === 'tabs') return false;
  return !isTouchTablet();
}
let lastTabsState = null;
function applyLayout() {
  const wide = window.innerWidth >= WIDE_MIN;
  const tabs = !wide || !wantSplit();
  $('#layoutBtn').hidden = !wide;
  $('#layoutBtn').setAttribute('aria-pressed', String(!tabs));
  if (tabs === lastTabsState) return;
  lastTabsState = tabs;
  document.body.classList.toggle('tabs', tabs);
  requestAnimationFrame(() => { sizeInk(); renderNotes(); });
}
$('#layoutBtn').addEventListener('click', () => {
  lsSet('cronota_layout', wantSplit() ? 'tabs' : 'split');
  applyLayout();
});
window.addEventListener('resize', applyLayout);
applyLayout();

/* keyboard shortcuts */
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, dialog')) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (mod && e.key === 'Enter') { e.preventDefault(); saveCanvas(); }
  else if (!mod && e.key.toLowerCase() === 'e') setMode(tool.mode === 'eraser' ? 'pen' : 'eraser');
});

$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const list = (Array.isArray(data) ? data : data.blocks || []).map(sanitizeBlock).filter(Boolean);
    const have = new Set(blocks.map((b) => b.id));
    const added = list.filter((b) => !have.has(b.id));
    blocks.push(...added);

    toast(t('imported', { n: added.length }));
  } catch {
    toast(t('importFail'));
  }
});

/* =========================================================
   Google Drive sync (optional). OAuth implicit flow by page
   redirect (no external script); notes live in one JSON file
   in the Drive appDataFolder and are merged per note.
   ========================================================= */
const GD_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const GD_FILE = 'cronota-notes.json';
const gd = {
  client: GD_CLIENT_ID || lsGet('cronota_gd_client', ''),
  on: lsGet('cronota_gd_on', '0') === '1',
  token: '', exp: 0,
  fileId: lsGet('cronota_gd_file', ''),
  last: +lsGet('cronota_gd_last', '0') || 0,
  busy: false, queued: false, timer: null, state: ''
};
try { const tk = JSON.parse(lsGet('cronota_gd_token', 'null')); if (tk && tk.exp > Date.now()) { gd.token = tk.token; gd.exp = tk.exp; } } catch {}
function gdRedirectUri() { return location.origin + location.pathname.replace(/index\.html$/, ''); }
function gdCanConnect() { return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'; }
function gdTokenOk() { return !!gd.token && gd.exp - 60000 > Date.now(); }

function gdConnect() {
  if (!gdCanConnect()) { toast(t('gdNeedHttps')); return; }
  if (!gd.client) { toast(t('gdNeedClient')); return; }
  const state = uid();
  try {
    sessionStorage.setItem('cronota_gd_state', state);
    if (strokes.length) sessionStorage.setItem('cronota_draft', JSON.stringify({ strokes, editNoteId }));
  } catch {}
  const q = new URLSearchParams({ client_id: gd.client, redirect_uri: gdRedirectUri(), response_type: 'token', scope: GD_SCOPE, include_granted_scopes: 'true', state });
  location.assign('https://accounts.google.com/o/oauth2/v2/auth?' + q);
}
/** Called once at start: picks up the token Google returns in the URL fragment. */
function gdTakeRedirect() {
  if (!location.hash || !/(access_token|error)=/.test(location.hash)) return null;
  const h = new URLSearchParams(location.hash.slice(1));
  let expected = null;
  try { expected = sessionStorage.getItem('cronota_gd_state'); sessionStorage.removeItem('cronota_gd_state'); } catch {}
  history.replaceState(null, '', location.pathname + location.search);
  if (!expected || h.get('state') !== expected) return null;
  if (h.get('error')) return 'denied';
  const token = h.get('access_token');
  if (!token) return null;
  gd.token = token;
  gd.exp = Date.now() + (parseInt(h.get('expires_in'), 10) || 3600) * 1000;
  lsSet('cronota_gd_token', JSON.stringify({ token: gd.token, exp: gd.exp }));
  gd.on = true; lsSet('cronota_gd_on', '1');
  return 'ok';
}
function gdRestoreDraft() {
  let d = null;
  try { d = JSON.parse(sessionStorage.getItem('cronota_draft') || 'null'); sessionStorage.removeItem('cronota_draft'); } catch {}
  if (!d || !Array.isArray(d.strokes) || !d.strokes.length) return;
  strokes = d.strokes.map(sanitizeStroke).filter(Boolean);
  if (d.editNoteId && blocks.some((b) => b.id === d.editNoteId)) editNoteId = d.editNoteId;
}

async function gdApi(url, opts = {}) {
  let r;
  try {
    r = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + gd.token, ...(opts.headers || {}) } });
  } catch { throw Object.assign(new Error(t('errNet')), { code: 'net' }); }
  if (r.status === 401) { gd.token = ''; gd.exp = 0; lsDel('cronota_gd_token'); throw Object.assign(new Error('401'), { code: 'auth' }); }
  if (!r.ok) {
    let msg = 'HTTP ' + r.status;
    try { const j = await r.json(); if (j.error && j.error.message) msg += ' ' + j.error.message; } catch {}
    throw Object.assign(new Error(msg), { code: r.status === 404 ? 'gone' : 'http', status: r.status });
  }
  return r;
}
/** Every copy of the notes file, newest first (two devices connecting at once can each create one). */
async function gdFindFiles() {
  const q = new URLSearchParams({ spaces: 'appDataFolder', q: `name='${GD_FILE}' and trashed=false`, fields: 'files(id,modifiedTime)', orderBy: 'modifiedTime desc', pageSize: '10' });
  const r = await gdApi('https://www.googleapis.com/drive/v3/files?' + q);
  const j = await r.json();
  return (j.files || []).map((f) => f.id);
}
/** Drive bumps a file's version on every write; comparing it tells us if another device wrote meanwhile. */
async function gdVersion(id) {
  const r = await gdApi(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?fields=version`);
  return String((await r.json()).version || '');
}
async function gdDelete(id) {
  try { await gdApi(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}`, { method: 'DELETE' }); } catch {}
}
async function gdDownload(id) {
  const r = await gdApi(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?alt=media`);
  try { return JSON.parse(await r.text()); } catch { return null; }
}
async function gdUpload(id, data) {
  const body = JSON.stringify(data);
  if (id) {
    await gdApi(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(id)}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
    return id;
  }
  const bd = 'cronota' + uid();
  const meta = JSON.stringify({ name: GD_FILE, parents: ['appDataFolder'], mimeType: 'application/json' });
  const multipart = `--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
  const r = await gdApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${bd}` }, body: multipart });
  return (await r.json()).id;
}

function inkSig(b) {
  const pts = b.strokes.reduce((n, s) => n + s.points.length, 0);
  const last = b.strokes.length ? b.strokes[b.strokes.length - 1].points.slice(-1)[0] : null;
  return [b.strokes.length, pts, last && last.x, last && last.y].join();
}
/** Per-note merge: newer updatedAt wins; a deletion wins over edits made before it.
    If both sides rewrote a note's ink since this device last synced (since), the losing
    version is kept as a copy next to it instead of being dropped. */
function mergeData(local, remote, since = 0) {
  const byId = new Map();
  const copies = [];
  for (const b of local.blocks) byId.set(b.id, b);
  for (const raw of remote.blocks) {
    const b = sanitizeBlock(raw);
    if (!b) continue;
    const mine = byId.get(b.id);
    if (!mine) { byId.set(b.id, b); continue; }
    const tm = Date.parse(mine.updatedAt), tr = Date.parse(b.updatedAt);
    if (tm === tr) continue;
    const [win, lose] = tr > tm ? [b, mine] : [mine, b];
    byId.set(b.id, win);
    if (since && tm > since && tr > since && inkSig(mine) !== inkSig(b)) {
      copies.push({ ...lose, id: (lose.id + '~' + uid()).slice(0, 80), updatedAt: new Date().toISOString() });
    }
  }
  const del = { ...sanitizeTombs(remote.deleted) };
  for (const [id, ts] of Object.entries(local.deleted)) del[id] = Math.max(del[id] || 0, ts);
  const out = [];
  for (const b of byId.values()) {
    if (del[b.id] && del[b.id] >= Date.parse(b.updatedAt)) continue;
    delete del[b.id];
    out.push(b);
  }
  return { blocks: out.concat(copies), deleted: del, conflicts: copies.length };
}
function dataSig(d) {
  return JSON.stringify([d.blocks.map((b) => b.id + '@' + b.updatedAt).sort(), Object.keys(d.deleted).sort()]);
}

function gdSetState(st) {
  gd.state = st;
  const btn = $('#syncBtn');
  btn.hidden = !gd.on;
  btn.classList.toggle('busy', st === 'busy');
  btn.classList.toggle('warn', st === 'auth' || st === 'err' || (gd.on && !gdTokenOk() && st !== 'busy'));
  if (dlg.open) gdRenderSettings();
}
function gdRenderSettings() {
  $('#gdClientInput').value = gd.client;
  $('#gdUri').textContent = gdRedirectUri();
  $('#gdClientField').hidden = !!GD_CLIENT_ID;
  $('#gdUriRow').hidden = !!GD_CLIENT_ID;
  $('#gdSyncBtn').hidden = !gd.on;
  $('#gdDisconnectBtn').hidden = !gd.on;
  $('#gdConnectBtn').hidden = gd.on && gdTokenOk();
  const r = $('#gdResult');
  let text = '', kind = 'info';
  if (!gdCanConnect()) { text = t('gdNeedHttps'); kind = 'err'; }
  else if (gd.state === 'busy') text = t('gdSyncing');
  else if (!gd.on) text = t('gdOff');
  else if (!gdTokenOk()) { text = t('gdExpired'); kind = 'err'; }
  else if (gd.last) { text = t('gdOn', { time: `${dayLabel(new Date(gd.last).toISOString())} ${timeLabel(new Date(gd.last).toISOString())}` }); kind = 'ok'; }
  else text = t('gdOnNever');
  r.textContent = text;
  r.className = 'result show ' + kind;
}

function gdSchedule() {
  if (!gd.on || !gdTokenOk()) return;
  clearTimeout(gd.timer);
  gd.timer = setTimeout(() => gdSync(), 2500);
}
const gdRemoteOf = (d) => ({ blocks: d && Array.isArray(d.blocks) ? d.blocks.map(sanitizeBlock).filter(Boolean) : [], deleted: sanitizeTombs(d && d.deleted) });
/** Reads the notes file (and folds in any stray duplicate files). */
async function gdPull(retry = true) {
  const ids = gd.fileId ? [gd.fileId] : await gdFindFiles();
  const id = ids[0] || '';
  let ver = '', data = gdRemoteOf(null), raw = null;
  if (id) {
    try { ver = await gdVersion(id); raw = await gdDownload(id); }
    catch (e) {
      if (e.code !== 'gone' || !retry) throw e;
      gd.fileId = ''; lsDel('cronota_gd_file');
      return gdPull(false);
    }
    data = gdRemoteOf(raw);
  }
  const extras = ids.slice(1);
  for (const x of extras) {
    let d = null;
    try { d = await gdDownload(x); } catch {}
    if (d) { const m = mergeData(data, gdRemoteOf(d)); data = { blocks: m.blocks, deleted: m.deleted }; }
  }
  return { id, ver, data, extras, fresh: !raw };
}
async function gdSync(interactive = false) {
  if (!gd.on) return;
  if (!gdTokenOk()) { gdSetState('auth'); if (interactive) gdConnect(); return; }
  if (gd.busy) { gd.queued = true; return; }
  gd.busy = true; gdSetState('busy');
  try {
    await saveChain;
    let conflicts = 0, id = '';
    for (let attempt = 0; ; attempt++) {
      const pull = await gdPull();
      const local = { blocks, deleted: tombs };
      const merged = mergeData(local, pull.data, gd.last);
      conflicts += merged.conflicts;
      const mSig = dataSig(merged);
      if (mSig !== dataSig(local)) {
        blocks = merged.blocks;
        tombs = merged.deleted;
        sigs = new Map(blocks.map((b) => [b.id, blockSig(b)]));
        if (selectedId && !blocks.some((b) => b.id === selectedId)) selectedId = null;
        persist(true);
        renderNotes(); renderKeywordChips();
      }
      id = pull.id;
      if (pull.fresh || pull.extras.length || mSig !== dataSig(pull.data)) {
        // Another device wrote while we merged: merge again instead of overwriting its notes.
        if (id && attempt < 3 && (await gdVersion(id)) !== pull.ver) continue;
        id = await gdUpload(id, { app: 'cronota', version: 1, savedAt: Date.now(), blocks: blocks.map((b) => ({ ...b })), deleted: { ...tombs } });
        for (const x of pull.extras) await gdDelete(x);
      }
      break;
    }
    gd.fileId = id; lsSet('cronota_gd_file', id);
    gd.last = Date.now(); lsSet('cronota_gd_last', String(gd.last));
    gd.busy = false; gdSetState('ok');
    if (conflicts) toast(t('gdConflict', { n: conflicts }));
    else if (interactive) toast(t('gdDone'));
  } catch (e) {
    gd.busy = false;
    gdSetState(e.code === 'auth' ? 'auth' : 'err');
    if (e.code === 'auth') { if (interactive) gdConnect(); }
    else if (interactive) toast(t('gdFail', { msg: e.message }));
  }
  if (gd.queued) { gd.queued = false; gdSync(); }
}
function gdDisconnect() {
  if (gd.token) fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(gd.token), { method: 'POST' }).catch(() => {});
  gd.on = false; gd.token = ''; gd.exp = 0; gd.fileId = ''; gd.last = 0;
  ['cronota_gd_on', 'cronota_gd_token', 'cronota_gd_file', 'cronota_gd_last'].forEach(lsDel);
  gdSetState('');
  toast(t('gdDisconnected'));
}
$('#gdClientInput').addEventListener('change', (e) => {
  if (GD_CLIENT_ID) return;
  gd.client = e.target.value.trim();
  lsSet('cronota_gd_client', gd.client);
});
$('#gdConnectBtn').addEventListener('click', () => {
  if (!GD_CLIENT_ID) {
    gd.client = $('#gdClientInput').value.trim();
    lsSet('cronota_gd_client', gd.client);
  }
  gdConnect();
});
$('#privacyLink').href = PRIVACY_URL;
$('#gdSyncBtn').addEventListener('click', () => gdSync(true));
$('#gdDisconnectBtn').addEventListener('click', gdDisconnect);
$('#syncBtn').addEventListener('click', () => gdSync(true));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && gd.on && gdTokenOk() && Date.now() - gd.last > 30000) gdSync();
});

/* =========================================================
   Language
   ========================================================= */
function applyLanguage(next) {
  lang = I18N[next] ? next : 'ko';
  lsSet('cronota_lang', lang);
  document.documentElement.lang = lang;
  $('#langSelect').value = lang;
  $('#langCode').textContent = t('code');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t(el.dataset.i18nTitle); el.setAttribute('aria-label', el.title); });
  $('#saveBtn').title = t('saveTitle');
  $('#sortBtn').title = t('sortNew') + ' / ' + t('sortOld');
  buildToolbar();
  setPenOnly(prefs.penOnly);
  updateStatus();
  renderNotes();
  renderKeywordChips();
  if (padIsOpen()) $('#padNote').textContent = prefs.key ? t('padNote') : t('padNoteNoAi');
  if (helpDlg.open) renderHelp();
}
$('#langSelect').addEventListener('change', (e) => applyLanguage(e.target.value));

/* =========================================================
   Init
   ========================================================= */
document.querySelectorAll('i[data-icon]').forEach((el) => {
  el.outerHTML = icon(el.dataset.icon, el.className);
});
document.documentElement.style.setProperty('--gap', prefs.gap + 'px');
document.documentElement.style.setProperty('--margin-x', MARGIN_X + 'px');
updateAiBadge();
scroller.classList.toggle('h', horizontal());
applyLanguage(lang);
setPageMode(prefs.pageMode);

let resizeTimer = null;
new ResizeObserver(() => sizeInk()).observe(scroller);
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { renderNotes(); if (padIsOpen()) sizePad(); }, 150);
});

const gdReturn = gdTakeRedirect();
/* Installable app: the service worker only runs when served over http(s). */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
  });
}
(async () => {
  await loadBlocks();
  gdRestoreDraft();
  layoutPages(true);
  afterCanvasChange();
  renderNotes();
  renderKeywordChips();
  gdSetState('');
  if (gdReturn === 'denied') toast(t('gdDenied'));
  if (gdReturn === 'ok') toast(t('gdConnected'));
  if (gd.on && gdTokenOk()) gdSync();
})();
</script>
</body>
