<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F1E8" />
<title>Markdowner · 아웃그리드 마크다운 편집기</title>
<meta name="description" content="브라우저에서 바로 쓰는 마크다운 문서 편집기. 문서는 내 기기에만 저장됩니다." />
<!-- Fonts: outgrid's own files first (fonts/ next to this file), public CDN as a fallback. -->
<style>
  @font-face { font-family: "wantedSans"; src: url("fonts/WantedSansVariable.woff2") format("woff2"); font-weight: 100 800; font-style: normal; font-display: swap; }
  @font-face { font-family: "maruBuri"; src: url("fonts/MaruBuri-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "maruBuri"; src: url("fonts/MaruBuri-SemiBold.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" />
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23244D3A'/%3E%3Cpath d='M14 44V20l10 12 10-12v24M42 20v24m0 0l-7-8m7 8l7-8' fill='none' stroke='%23F5F1E8' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #F5F1E8;
    --surface: #FCFAF5;
    --paper: #FFFDF8;
    --line: #E8E0CF;
    --ink: #1C2824;
    --ink-2: #33403A;
    --muted: #5E665F;
    --faint: #9A9F95;
    --hair: #E3DCCB;
    --hover: #F0EADD;
    --press: #E7DFCD;
    --dark: #244D3A;
    --dark-2: #1B3B2C;
    --river: #3E6F73;
    --clay: #8A5A3B;
    --sand: #D9C8A9;
    --focus: #8A5A3B;
    --danger: #963F3B;
    --shadow: 0 1px 0 rgba(28,40,36,.03), 0 18px 40px -30px rgba(28,40,36,.30);
    --sans: "wantedSans", "Wanted Sans Variable", "Wanted Sans", -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
    --serif: "maruBuri", "MaruBuri", "Batang", "Noto Serif KR", serif;
    --mono: ui-monospace, "D2Coding", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    --r-sm: 10px;
    --r-md: 13px;
    --r-lg: 20px;
    --ed-size: 16px;
    --ed-font: var(--sans);
    --pv-font: var(--serif);
    --pv-width: 760px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans); word-break: keep-all; background: var(--bg); color: var(--ink);
    font-size: 14px; letter-spacing: -0.005em; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; opacity: .3; }
  input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2.5px solid var(--focus); outline-offset: 3px; }
  ::selection { background: rgba(36,77,58,.16); }
  svg.i { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.sm { width: 16px; height: 16px; }
  svg.i .f { fill: currentColor; stroke: none; }
  .muted { color: var(--faint); }

  /* ---------- Header ---------- */
  .top { flex: none; background: var(--bg); z-index: 30; }
  .top-inner { max-width: 1600px; margin: 0 auto; padding: 14px 24px 8px; display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; flex: none; text-decoration: none; color: inherit; }
  .logo { display: block; height: 30px; width: auto; }
  .app-name { font-family: var(--sans); font-weight: 700; font-size: 19px; letter-spacing: -.02em; color: var(--dark); padding-left: 12px; border-left: 1.5px solid var(--sand); line-height: 1; }
  .doc-head { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
  #titleInput { min-width: 0; width: 100%; max-width: 440px; height: 40px; border-radius: 999px; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); padding: 0 18px; font-family: var(--serif); font-weight: 600; font-size: 15px; text-align: center; outline: none; color: var(--ink); text-overflow: ellipsis; }
  #titleInput:focus { background: #fff; box-shadow: inset 0 0 0 1.5px var(--dark), 0 0 0 4px rgba(36,77,58,.08); }
  #titleInput::placeholder { color: var(--faint); font-weight: 400; }
  .save-state { font-size: 12px; color: var(--faint); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .save-state i { width: 7px; height: 7px; border-radius: 999px; background: #3F8A5E; display: inline-block; }
  .save-state.dirty i { background: #B7793F; }
  .head-actions { display: flex; align-items: center; gap: 2px; flex: none; }
  .icon-btn { width: 38px; height: 38px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--ink-2); transition: background .15s, color .15s; flex: none; }
  .icon-btn:hover { background: var(--hover); color: var(--ink); }
  .icon-btn[aria-pressed="true"] { background: var(--dark); color: var(--surface); }
  .icon-btn.sm { width: 30px; height: 30px; }

  /* ---------- Buttons / inputs ---------- */
  .btn { height: 36px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 13px; background: var(--hover); color: var(--ink); white-space: nowrap; transition: background .15s, box-shadow .15s; }
  .btn:hover:not(:disabled) { background: var(--press); }
  .btn.primary { background: var(--dark); color: var(--surface); box-shadow: 0 8px 18px -10px rgba(36,77,58,.7); }
  .btn.primary:hover:not(:disabled) { background: var(--dark-2); }
  .btn.ghost { background: none; color: var(--muted); }
  .btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .btn.danger { background: #F6E9E6; color: var(--danger); }
  .btn.danger:hover:not(:disabled) { background: #EFDAD5; }
  .pill-input { height: 38px; border-radius: 999px; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--hair); padding: 0 16px; font-size: 13.5px; outline: none; min-width: 0; width: 100%; transition: box-shadow .15s, background .15s; }
  .pill-input:focus { background: #fff; box-shadow: inset 0 0 0 1.5px var(--dark), 0 0 0 4px rgba(36,77,58,.08); }
  .pill-input::placeholder { color: var(--faint); }
  .seg { display: inline-flex; padding: 3px; background: var(--press); border-radius: 999px; gap: 2px; flex: none; }
  .seg button { height: 30px; padding: 0 12px; border-radius: 999px; font-weight: 600; font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; transition: background .15s, color .15s; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--dark); color: var(--surface); box-shadow: 0 6px 14px -8px rgba(36,77,58,.6); }
  .seg button svg.i { width: 16px; height: 16px; }
  .select-pill { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px 0 12px; border-radius: 999px; color: var(--ink-2); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .select-pill:hover { background: var(--hover); }
  .select-pill select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .select-pill svg.i { width: 14px; height: 14px; }

  /* ---------- Layout ---------- */
  main { flex: 1; min-height: 0; width: 100%; max-width: 1600px; margin: 0 auto; padding: 6px 24px 20px; display: flex; gap: 16px; }
  .panel { background: var(--surface); border-radius: var(--r-lg); display: flex; flex-direction: column; min-height: 0; overflow: hidden; box-shadow: 0 0 0 1px var(--hair), var(--shadow); }
  .side { width: 300px; flex: none; }
  body.side-closed .side { display: none; }
  .work { flex: 1; min-width: 0; }
  .scrim { display: none; }

  /* ---------- Sidebar ---------- */
  .side-head { padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--hair); }
  .side-row { display: flex; align-items: center; gap: 6px; }
  .side-row .seg { flex: 1; }
  .side-row .seg button { flex: 1; justify-content: center; }
  .new-wrap { display: flex; gap: 4px; }
  .new-wrap .btn.primary { flex: 1; height: 38px; }
  .new-wrap .btn.tpl { width: 38px; height: 38px; padding: 0; background: var(--hover); }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 13px; top: 10px; color: var(--faint); width: 18px; height: 18px; pointer-events: none; }
  .search-wrap input { padding-left: 38px; }
  .filters { display: flex; align-items: center; gap: 4px; }
  .chip { height: 30px; padding: 0 11px; border-radius: 999px; white-space: nowrap; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); flex: none; transition: background .15s; }
  .chip:hover { background: var(--hover); }
  .chip .n { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { background: var(--dark); color: var(--surface); }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .75; }
  .filters .select-pill { margin-left: auto; }
  .doc-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; background: var(--bg); overscroll-behavior: contain; }
  .doc-item { position: relative; display: block; width: 100%; text-align: left; padding: 11px 40px 11px 14px; border-radius: var(--r-md); margin-bottom: 4px; transition: background .15s, box-shadow .15s; cursor: pointer; }
  .doc-item:hover { background: var(--surface); }
  .doc-item.active { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--dark), 0 10px 24px -22px rgba(28,40,36,.35); }
  .doc-item .t { font-family: var(--serif); font-weight: 600; font-size: 14.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
  .doc-item .t .star { color: var(--clay); flex: none; display: inline-flex; }
  .doc-item .t .star svg { width: 13px; height: 13px; fill: currentColor; }
  .doc-item .x { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
  .doc-item .d { font-size: 11px; color: var(--faint); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .doc-item .more { position: absolute; top: 7px; right: 6px; width: 30px; height: 30px; border-radius: var(--r-sm); display: grid; place-items: center; color: var(--faint); }
  .doc-item .more:hover { background: var(--hover); color: var(--ink); }
  .doc-item mark { background: rgba(217,200,169,.7); color: inherit; border-radius: 3px; padding: 0 1px; }
  .list-empty { text-align: center; color: var(--faint); padding: 48px 16px; line-height: 1.8; font-size: 13px; }
  .list-empty b { display: block; font-family: var(--serif); color: var(--dark); font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .side-foot { border-top: 1px solid var(--hair); padding: 8px 10px; display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--faint); }
  .side-foot .btn { height: 30px; padding: 0 10px; font-size: 12px; }
  .side-foot .usage { margin-left: auto; padding-right: 4px; font-variant-numeric: tabular-nums; }
  .toc { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 8px; }
  .toc a { display: block; padding: 6px 10px; border-radius: var(--r-sm); color: var(--ink-2); text-decoration: none; font-size: 13px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .toc a:hover { background: var(--hover); color: var(--ink); }
  .toc a.on { color: var(--dark); font-weight: 700; background: var(--hover); }
  .toc a.l1 { font-family: var(--serif); font-weight: 600; font-size: 14px; color: var(--ink); }
  .toc a.l2 { padding-left: 22px; } .toc a.l3 { padding-left: 34px; } .toc a.l4, .toc a.l5, .toc a.l6 { padding-left: 46px; font-size: 12.5px; color: var(--muted); }

  /* ---------- Toolbar ---------- */
  .work { container-type: inline-size; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--hair); background: var(--surface); flex: none; }
  .tools { flex: 1; min-width: 0; display: flex; align-items: center; overflow-x: auto; scrollbar-width: none; mask-image: linear-gradient(to right, #000 calc(100% - 18px), transparent); -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 18px), transparent); padding-right: 14px; }
  .tools::-webkit-scrollbar { display: none; }
  @container (max-width: 1180px) { #viewSeg .lbl { display: none; } #viewSeg button { padding: 0 10px; } }
  .tgroup { display: flex; align-items: center; gap: 1px; flex: none; }
  .sep { width: 1px; height: 18px; background: var(--hair); margin: 0 6px; flex: none; }
  .tool { height: 34px; min-width: 34px; padding: 0 6px; border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center; gap: 2px; color: var(--ink-2); transition: background .15s, color .15s; flex: none; font-weight: 700; font-size: 13px; }
  .tool:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .tool[aria-pressed="true"] { background: var(--dark); color: var(--surface); }
  .tool svg.i.chev { width: 12px; height: 12px; margin-left: -1px; }
  .toolbar .spacer { flex: 1; min-width: 8px; }

  /* ---------- Find bar ---------- */
  .findbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--hair); background: var(--bg); flex-wrap: wrap; flex: none; }
  .findbar .pill-input { height: 34px; flex: 1 1 160px; max-width: 280px; font-size: 13px; padding: 0 14px; }
  .findbar .opt { height: 30px; min-width: 32px; padding: 0 7px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); font-family: var(--mono); }
  .findbar .opt:hover { background: var(--hover); }
  .findbar .opt[aria-pressed="true"] { background: var(--dark); color: var(--surface); }
  .findbar .count { font-size: 12px; color: var(--muted); min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
  .findbar .btn { height: 32px; padding: 0 12px; font-size: 12.5px; }
  .findbar .grp { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

  /* ---------- Panes ---------- */
  .panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); position: relative; }
  body[data-view="edit"] .panes, body[data-view="preview"] .panes, body[data-view="rich"] .panes { grid-template-columns: minmax(0,1fr); }
  body[data-view="edit"] .prev-pane, body[data-view="preview"] .edit-pane, body[data-view="rich"] .edit-pane { display: none; }
  .pane { min-height: 0; min-width: 0; position: relative; }
  .edit-pane { background: var(--paper); }
  body[data-view="split"] .edit-pane { border-right: 1px solid var(--hair); }
  #editor {
    display: block; width: 100%; height: 100%; resize: none; border: 0; outline: none; background: var(--paper); color: var(--ink);
    font-family: var(--ed-font); font-size: var(--ed-size); line-height: 1.8; letter-spacing: 0;
    padding: 28px max(28px, calc((100% - var(--pv-width)) / 2)) 40vh; tab-size: 4; -moz-tab-size: 4;
    overscroll-behavior: contain; caret-color: var(--dark); word-break: break-all;
  }
  #editor.nowrap { white-space: pre; overflow-x: auto; word-break: normal; }
  #editor::placeholder { color: var(--faint); }
  .prev-pane { overflow-y: auto; background: var(--paper); overscroll-behavior: contain; }
  .prev-pane.drop, .edit-pane.drop { box-shadow: inset 0 0 0 2px var(--dark); }
  #preview { max-width: var(--pv-width); margin: 0 auto; padding: 28px 32px 30vh; min-height: 100%; outline: none; }
  body[data-view="rich"] #preview { cursor: text; }
  body[data-view="rich"] .prev-pane { background: #fff; }
  .rich-badge { position: absolute; top: 10px; right: 14px; z-index: 3; font-size: 11.5px; font-weight: 600; color: var(--clay); background: var(--surface); border-radius: 999px; padding: 5px 11px; box-shadow: 0 0 0 1px var(--hair); display: none; pointer-events: none; }
  body[data-view="rich"] .rich-badge { display: block; }

  /* ---------- Status bar ---------- */
  .status { flex: none; display: flex; align-items: center; gap: 14px; padding: 7px 16px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; background: var(--surface); }
  .status b { color: var(--ink-2); font-weight: 600; }
  .status .grow { flex: 1; }
  .status .file { color: var(--clay); overflow: hidden; text-overflow: ellipsis; max-width: 30%; }

  /* ---------- Menus ---------- */
  .menu { position: fixed; z-index: 80; min-width: 210px; max-width: calc(100vw - 16px); max-height: calc(100dvh - 24px); overflow-y: auto; background: var(--surface); border-radius: 16px; padding: 6px; box-shadow: 0 0 0 1px var(--hair), 0 22px 48px -22px rgba(28,40,36,.42); }
  .menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 38px; border-radius: var(--r-sm); font-size: 13.5px; text-align: left; color: var(--ink); white-space: nowrap; }
  .menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }
  .menu button svg.i { width: 17px; height: 17px; color: var(--muted); }
  .menu button .k { margin-left: auto; padding-left: 18px; font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
  .menu button.danger, .menu button.danger svg.i { color: var(--danger); }
  .menu .mh { font-size: 11px; font-weight: 700; color: var(--clay); letter-spacing: .06em; padding: 8px 12px 4px; }
  .menu hr { border: 0; border-top: 1px solid var(--hair); margin: 5px 4px; }
  .menu .h1 { font-family: var(--serif); font-size: 19px; font-weight: 600; }
  .menu .h2 { font-family: var(--serif); font-size: 17px; font-weight: 600; }
  .menu .h3 { font-family: var(--serif); font-size: 15.5px; font-weight: 600; }
  .menu .h4, .menu .h5, .menu .h6 { font-family: var(--serif); font-size: 14px; font-weight: 600; }

  /* ---------- Toast ---------- */
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--dark); color: var(--surface); padding: 11px 18px; border-radius: 999px; box-shadow: 0 14px 30px -14px rgba(28,40,36,.6); font-size: 13px; z-index: 100; display: none; align-items: center; gap: 12px; max-width: calc(100vw - 32px); }
  #toast.show { display: flex; }
  #toast button { color: var(--sand); font-weight: 600; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- Dialogs ---------- */
  dialog { border: 0; border-radius: 22px; padding: 0; width: min(480px, calc(100vw - 32px)); background: var(--surface); box-shadow: 0 0 0 1px var(--hair), 0 30px 70px -30px rgba(28,40,36,.45); color: var(--ink); }
  dialog.wide { width: min(760px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(28,40,36,.32); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 8px; gap: 12px; }
  .dlg-head h2 { margin: 0; font-family: var(--serif); font-size: 20px; font-weight: 600; letter-spacing: -.02em; color: var(--dark); }
  .dlg-body { padding: 6px 22px 22px; display: flex; flex-direction: column; gap: 18px; max-height: 75dvh; overflow-y: auto; }
  .sec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--clay); letter-spacing: .06em; }
  .sec p { margin: 0 0 10px; font-size: 13px; color: var(--muted); line-height: 1.65; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .field .lb { font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .field input[type=text], .field input[type=url], .field input[type=number], .field textarea { height: 40px; border: 0; background: #fff; box-shadow: inset 0 0 0 1px var(--hair); border-radius: var(--r-sm); padding: 0 12px; font-size: 14px; outline: none; }
  .field textarea { height: auto; padding: 10px 12px; resize: vertical; font-family: var(--mono); font-size: 13px; line-height: 1.6; }
  .field input:focus, .field textarea:focus { box-shadow: inset 0 0 0 1.5px var(--dark), 0 0 0 4px rgba(36,77,58,.08); }
  .fields-row { display: flex; gap: 10px; }
  .fields-row .field { flex: 1; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13.5px; padding: 9px 0; border-bottom: 1px solid var(--hair); }
  .set-row:last-child { border-bottom: 0; }

    </div>

      <button class="icon-btn" id="openBtn" title="열기·가져오기 (Ctrl+O)" aria-label="열기" data-icon="folder"></button>

      <button class="icon-btn hide-sm" id="historyBtn" title="버전 기록" aria-label="버전 기록" data-icon="history"></button>
      <button class="icon-btn hide-sm" id="focusBtn" title="집중 모드 (Ctrl+Shift+F)" aria-label="집중 모드" data-icon="focus"></button>
      <button class="icon-btn" id="settingsBtn" title="설정" aria-label="설정" data-icon="sliders"></button>
      <button class="icon-btn hide-sm" id="helpBtn" title="도움말·단축키 (F1)" aria-label="도움말" data-icon="help"></button>

<main>
  <aside class="panel side" id="side">
    <div class="side-head">
      <div class="side-row">
        <div class="seg" role="tablist">
          <button data-stab="docs" aria-pressed="true"><span data-icon="doc"></span>문서</button>
          <button data-stab="toc" aria-pressed="false"><span data-icon="toc"></span>목차</button>
        </div>
      </div>
      <div id="docsHead" style="display:flex;flex-direction:column;gap:10px">
        <div class="new-wrap">
          <button class="btn primary" id="newBtn" title="새 문서 (Ctrl+Alt+N)"><span data-icon="plus"></span>새 문서</button>
          <button class="btn tpl" id="tplBtn" title="서식으로 시작" aria-label="서식으로 시작" data-icon="template"></button>
        </div>
        <div class="search-wrap"><span data-icon="search"></span><input class="pill-input" id="docSearch" type="search" placeholder="문서 검색" autocomplete="off" /></div>
        <div class="filters">
          <button class="chip" data-filter="all" aria-pressed="true">전체 <span class="n" id="nAll"></span></button>
          <button class="chip" data-filter="fav" aria-pressed="false">즐겨찾기 <span class="n" id="nFav"></span></button>
          <button class="chip" data-filter="trash" aria-pressed="false">휴지통 <span class="n" id="nTrash"></span></button>
          <label class="select-pill" title="정렬"><span id="sortLabel">수정순</span><span data-icon="chev"></span>
            <select id="sortSel" aria-label="정렬">
              <option value="updated">수정순</option>
              <option value="created">만든순</option>
              <option value="title">제목순</option>
            </select>
          </label>
        </div>
      </div>
    </div>
    <div class="doc-list" id="docList"></div>
    <nav class="toc" id="toc" hidden></nav>
    <div class="side-foot" id="sideFoot">
      <button class="btn ghost" id="backupBtn" title="모든 문서를 파일 하나로 백업">백업</button>
      <button class="btn ghost" id="restoreBtn" title="백업 파일에서 복원">복원</button>
      <span class="usage" id="usage"></span>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <section class="panel work" id="work">
    <div class="toolbar" id="toolbar">
      <div class="tools">
      <div class="tgroup">
        <button class="tool" data-cmd="undo" title="실행 취소 (Ctrl+Z)" data-icon="undo"></button>
        <button class="tool" data-cmd="redo" title="다시 실행 (Ctrl+Y)" data-icon="redo"></button>
      </div>
      <span class="sep"></span>
      <div class="tgroup">
        <button class="tool" data-cmd="headingMenu" title="제목 (Ctrl+1~6)"><span data-icon="heading"></span><span data-icon="chev" class="chevw"></span></button>
        <button class="tool" data-cmd="bold" title="굵게 (Ctrl+B)" data-icon="bold"></button>
        <button class="tool" data-cmd="italic" title="기울임 (Ctrl+I)" data-icon="italic"></button>
        <button class="tool" data-cmd="strike" title="취소선 (Ctrl+Shift+X)" data-icon="strike"></button>
        <button class="tool" data-cmd="mark" title="형광펜 (Ctrl+Shift+H)" data-icon="marker"></button>
        <button class="tool" data-cmd="code" title="인라인 코드 (Ctrl+E)" data-icon="code"></button>
      </div>
      <span class="sep"></span>
      <div class="tgroup">
        <button class="tool" data-cmd="ul" title="글머리 목록 (Ctrl+Shift+8)" data-icon="ul"></button>
        <button class="tool" data-cmd="ol" title="번호 목록 (Ctrl+Shift+7)" data-icon="ol"></button>
        <button class="tool" data-cmd="task" title="할 일 목록 (Ctrl+Shift+9)" data-icon="task"></button>
        <button class="tool" data-cmd="quote" title="인용 (Ctrl+Shift+.)" data-icon="quote"></button>
        <button class="tool" data-cmd="alertMenu" title="알림 상자"><span data-icon="alert"></span><span data-icon="chev" class="chevw"></span></button>
      </div>
      <span class="sep"></span>
      <div class="tgroup">
        <button class="tool" data-cmd="link" title="링크 (Ctrl+K)" data-icon="link"></button>
        <button class="tool" data-cmd="image" title="이미지" data-icon="image"></button>
        <button class="tool" data-cmd="tableMenu" title="표"><span data-icon="table"></span><span data-icon="chev" class="chevw"></span></button>
        <button class="tool" data-cmd="codeblock" title="코드 블록 (Ctrl+Shift+C)" data-icon="codeblock"></button>
        <button class="tool" data-cmd="hr" title="구분선" data-icon="hr"></button>
      </div>
      <span class="sep"></span>
      <div class="tgroup">
        <button class="tool" data-cmd="mathMenu" title="수식"><span data-icon="sigma"></span><span data-icon="chev" class="chevw"></span></button>
        <button class="tool" data-cmd="mermaidMenu" title="다이어그램 (Mermaid)"><span data-icon="diagram"></span><span data-icon="chev" class="chevw"></span></button>
        <button class="tool" data-cmd="footnote" title="각주" data-icon="footnote"></button>
        <button class="tool" data-cmd="insertMenu" title="더 넣기"><span data-icon="plus"></span><span data-icon="chev" class="chevw"></span></button>
      </div>
      <span class="sep"></span>
      <div class="tgroup">
        <button class="tool" data-cmd="find" title="찾기·바꾸기 (Ctrl+F / Ctrl+H)" data-icon="search"></button>
      </div>
      </div>
      <div class="seg" id="viewSeg" role="group" aria-label="보기">
        <button data-view="edit" title="편집만 (Ctrl+/ 로 전환)"><span data-icon="pencil"></span><span class="lbl">편집</span></button>
        <button data-view="split" class="split-opt" title="나란히 보기"><span data-icon="columns"></span><span class="lbl">분할</span></button>
        <button data-view="preview" title="미리보기"><span data-icon="eye"></span><span class="lbl">미리보기</span></button>
        <button data-view="rich" title="미리보기 화면에서 바로 고치기"><span data-icon="rich"></span><span class="lbl">서식 편집</span></button>
      </div>
    </div>

    <div class="findbar" id="findBar" hidden>
      <div class="grp" style="flex:1 1 300px">
        <input class="pill-input" id="findInput" type="text" placeholder="찾기" autocomplete="off" spellcheck="false" />
        <button class="opt" id="optCase" aria-pressed="false" title="대소문자 구분">Aa</button>
        <button class="opt" id="optWord" aria-pressed="false" title="단어 단위">ab</button>
        <button class="opt" id="optRegex" aria-pressed="false" title="정규식">.*</button>
        <span class="count" id="findCount"></span>
        <button class="icon-btn sm" id="findPrev" title="이전 (Shift+Enter)" data-icon="up"></button>
        <button class="icon-btn sm" id="findNext" title="다음 (Enter)" data-icon="down"></button>
      </div>
      <div class="grp" style="flex:1 1 300px">
        <input class="pill-input" id="replaceInput" type="text" placeholder="바꿀 내용" autocomplete="off" spellcheck="false" />
        <button class="btn" id="replaceOne">바꾸기</button>
        <button class="btn" id="replaceAll">모두 바꾸기</button>
        <button class="icon-btn sm" id="findClose" title="닫기 (Esc)" data-icon="close"></button>
      </div>
    </div>

/* ================= Storage (IndexedDB) ================= */
const DB = (() => {
  let dbp;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open('markdowner', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('images')) d.createObjectStore('images', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('versions')) d.createObjectStore('versions', { keyPath: 'id', autoIncrement: true }).createIndex('doc', 'docId');
        if (!d.objectStoreNames.contains('handles')) d.createObjectStore('handles');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const rq = fn(t.objectStore(store));
      let out;
      if (rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('abort'));
    });
  }
  return {
    get: (st, k) => tx(st, 'readonly', s => s.get(k)),
    put: (st, v, k) => tx(st, 'readwrite', s => (k === undefined ? s.put(v) : s.put(v, k))),
    del: (st, k) => tx(st, 'readwrite', s => s.delete(k)),
    all: st => tx(st, 'readonly', s => s.getAll()),
    byIndex: (st, idx, k) => tx(st, 'readonly', s => s.index(idx).getAll(k)),
    count: st => tx(st, 'readonly', s => s.count()),
  };
})();

  if (imgURL.has(id)) return imgURL.get(id);
  const rec = await DB.get('images', id).catch(() => null);
  if (!rec || !rec.blob) return null;
  const u = URL.createObjectURL(rec.blob);
  imgURL.set(id, u);
  return u;
}
async function shrinkImage(blob) {
  const max = Number(S.imgMax) || 0;
  if (!max || !/^image\/(jpeg|png|webp)$/.test(blob.type) || blob.size < 600 * 1024) return blob;
  try {
    const bmp = await createImageBitmap(blob);
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (sc >= 1 && blob.size < 1.5 * 1024 * 1024) return blob;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const type = blob.type === 'image/jpeg' ? 'image/jpeg' : 'image/webp';
    const out = await new Promise(r => c.toBlob(r, type, 0.86));
    return out && out.size < blob.size ? out : blob;
  } catch { return blob; }
}

function preprocess(src) {

    if (fence) { if (f && f[1][0] === fence[0] && f[1].length >= fence.length && /^\s{0,3}[`~]+\s*$/.test(L)) fence = null; out.push(L); continue; }
    if (f) { fence = f[1]; out.push(L); continue; }

const ALERTS = {

  WARNING: ['warning', '주의', 'alert'], CAUTION: ['caution', '경고', 'alert'],

    const p = bq.firstElementChild;

    const m = /^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\][ \t]*(?:<br>)?\n?/i.exec(p.innerHTML);

    const min = Math.min(...hs.map(h => +h.tagName[1]), 9);

  const todo = boxes.filter(b => !mmdCache.has(b.dataset.mmd));

    catch { todo.forEach(b => { b.className = 'mermaid-box err'; b.textContent = '다이어그램 도구를 불러오지 못했어요 (인터넷 연결 확인).\n\n' + b.dataset.mmd; }); return; }
    for (const b of todo) {

    $$('.mermaid-box.wait[data-mmd]', preview).forEach(b => { const c = mmdCache.get(b.dataset.mmd); if (c) setMmdBox(b, c); });
  });
  return mmdBusy;
}

const lastSnap = new Map();
async function versionsOf(id) {
  const v = await DB.byIndex('versions', 'doc', id).catch(() => []);
  return v.sort((a, b) => b.at - a.at);
}
async function addVersion(doc, body) {
  await DB.put('versions', { docId: doc.id, body, at: Date.now() });
  lastSnap.set(doc.id, { at: Date.now(), body });
  const all = await versionsOf(doc.id);
  for (const v of all.slice(50)) await DB.del('versions', v.id);
}
async function snapshot(doc, force) {
  let last = lastSnap.get(doc.id);
  if (last === undefined) { const all = await versionsOf(doc.id); last = all[0] ? { at: all[0].at, body: all[0].body } : null; lastSnap.set(doc.id, last); }
  if (!snapDone) {
    snapDone = true;
    if (openBody && (!last || last.body !== openBody)) { await addVersion(doc, openBody); last = lastSnap.get(doc.id); }
  }
  if (force || !last || (Date.now() - last.at > 5 * 60 * 1000 && last.body !== doc.body)) {
    if (!last || last.body !== doc.body) await addVersion(doc, doc.body);
  }
}

/* task toggling from the preview */
function toggleTask(n, checked) {
  const lines = ed.value.split('\n');
  let fence = null, k = 0, pos = 0;
  for (const L of lines) {
    const f = /^\s{0,3}(`{3,}|~{3,})/.exec(L);
    if (fence) { if (f && f[1][0] === fence[0]) fence = null; }
    else if (f) fence = f[1];
    else {
      const m = /^(\s*(?:>\s*)*(?:[-*+]|\d+[.)])\s+\[)([ xX])\]/.exec(L);
      if (m) {
        if (k === n) {
          const at = pos + m[1].length;
          const keep = [ed.selectionStart, ed.selectionEnd];
          const st = prevPane.scrollTop;
          ed.setRangeText(checked ? 'x' : ' ', at, at + 1, 'preserve');
          ed.setSelectionRange(keep[0], keep[1]);
          onSourceInput();
          renderPreview(); prevPane.scrollTop = st;
          return;

const F = { list: [], idx: -1 };
const findInput = $('#findInput'), replaceInput = $('#replaceInput');
function findRegex() {
  const q = findInput.value;

  let src = $('#optRegex').getAttribute('aria-pressed') === 'true' ? q : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  if ($('#optWord').getAttribute('aria-pressed') === 'true') src = '(?<![\\p{L}\\p{N}_])(?:' + src + ')(?![\\p{L}\\p{N}_])';
  try { return new RegExp(src, 'gu' + ($('#optCase').getAttribute('aria-pressed') === 'true' ? '' : 'i')); } catch { return 'bad'; }
}

    const v = ed.value; let m; re.lastIndex = 0;
    while ((m = re.exec(v))) { if (!m[0]) { re.lastIndex++; continue; } F.list.push([m.index, m.index + m[0].length]); if (F.list.length >= 5000) break; }
  }

  F.idx = F.list.findIndex(([a]) => a >= s);
  if (F.idx < 0 && F.list.length) F.idx = 0;
  const exact = F.list.findIndex(([a, b]) => a === ed.selectionStart && b === ed.selectionEnd);
  if (exact >= 0) F.idx = exact;
  paintFind();
  $('#findCount').textContent = re === 'bad' ? '식 오류' : !findInput.value ? '' : F.list.length ? `${F.idx + 1}/${nf(F.list.length)}` : '없음';
}

  const v = ed.value;

  F.list.forEach(([a, b], i) => { html += esc(v.slice(last, a)) + `<mark${i === F.idx ? ' class="cur"' : ''}>${esc(v.slice(a, b))}</mark>`; last = b; });

  else { let i = -1; F.list.forEach(([a, b], k) => { if (b <= s && a < s) i = k; }); if (i < 0) i = F.list.length - 1; F.idx = i; }

}

/* ================= Editor keys ================= */
const PAIRS = { '(': ')', '[': ']', '{': '}', '"': '"', '`': '`' };
const WRAPS = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`', '*': '*', '_': '_', '~': '~', '<': '>' };
let plainPaste = false;
ed.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  const mod = e.ctrlKey || e.metaKey;
  const { s, e: en, v } = sel();
  if (e.key === 'Enter' && !e.shiftKey && !mod && !e.altKey && s === en) {
    const ls = v.lastIndexOf('\n', s - 1) + 1;
    let le = v.indexOf('\n', s); if (le < 0) le = v.length;
    const line = v.slice(ls, le), head = v.slice(ls, s);
    let m = /^(\s*(?:>\s?)*)([-*+]|(\d+)([.)]))(\s+)(\[[ xX]\]\s+)?/.exec(line);
    if (m && head.length >= m[0].length) {
      e.preventDefault();
      if (!line.slice(m[0].length).trim() && s === le) { const keep = m[1].replace(/\s+$/, m[1].trim() ? ' ' : ''); const rep = keep ? keep : '\n'; replaceRange(ls, le, rep, ls + rep.length); return; }
      const marker = m[3] ? (+m[3] + 1) + m[4] : m[2];
      const ins = '\n' + m[1] + marker + m[5] + (m[6] ? '[ ] ' : '');
      replaceRange(s, s, ins, s + ins.length);
      return;
    }
    m = /^(\s*>\s?)+/.exec(line);
    if (m && head.length >= m[0].length) {
      e.preventDefault();
      if (!line.slice(m[0].length).trim() && s === le) { replaceRange(ls, le, '', ls); return; }
      replaceRange(s, s, '\n' + m[0], s + 1 + m[0].length); return;
    }
    m = /^[ \t]+/.exec(line);
    if (m && head.length >= m[0].length) { e.preventDefault(); replaceRange(s, s, '\n' + m[0], s + 1 + m[0].length); return; }
    return;
  }
  if (e.key === 'Tab' && !mod && !e.altKey) {
    e.preventDefault();
    const ls = v.lastIndexOf('\n', s - 1) + 1;
    const line = v.slice(ls, (v.indexOf('\n', s) + 1 || v.length + 1) - 1);
    if (e.shiftKey) indentLines(true);
    else if (v.slice(s, en).includes('\n') || ANY_LIST.test(line) || /^\s*>/.test(line)) indentLines(false);
    else if (findTable()) { // jump to next cell
      const nx = v.indexOf('|', en);
      if (nx >= 0) { const p = Math.min(nx + 2, v.length); ed.setSelectionRange(p, p); }
    } else replaceRange(s, en, '    ', s + 4);
    return;
  }
  if (e.altKey && !mod && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); moveLines(e.key === 'ArrowUp' ? -1 : 1); return; }
  if (mod && e.shiftKey && e.code === 'KeyD') { e.preventDefault(); duplicateLines(); return; }
  if (mod && e.shiftKey && e.code === 'KeyK') { e.preventDefault(); deleteLines(); return; }
  if (mod && e.shiftKey && e.code === 'KeyV') { plainPaste = true; setTimeout(() => { plainPaste = false; }, 400); return; }
  if (!mod && !e.altKey && s !== en && WRAPS[e.key]) {
    e.preventDefault();
    const t = v.slice(s, en);
    replaceRange(s, en, e.key + t + WRAPS[e.key], s + 1, s + 1 + t.length);
    return;
  }
  if (!mod && !e.altKey && s === en && S.autopair) {
    const next = v[s] || '';
    const closers = Object.values(PAIRS);
    if (closers.includes(e.key) && next === e.key && (e.key !== '"' && e.key !== '`' ? true : v[s - 1] !== '\\')) {
      const opener = Object.keys(PAIRS).find(k => PAIRS[k] === e.key);
      if (opener === e.key || v.slice(0, s).split(opener).length > v.slice(0, s).split(e.key).length - 1) { e.preventDefault(); ed.setSelectionRange(s + 1, s + 1); return; }
    }
    if (PAIRS[e.key] && (!next || /[\s)\]}.,;:!?]/.test(next))) {
      const prev = v[s - 1] || '';
      if ((e.key === '"' || e.key === '`') && /[\p{L}\p{N}]/u.test(prev)) return;
      if (e.key === '`' && v.slice(s - 2, s) === '``') return;
      e.preventDefault();
      replaceRange(s, s, e.key + PAIRS[e.key], s + 1);
      return;
    }
    if (e.key === 'Backspace' && PAIRS[v[s - 1]] && PAIRS[v[s - 1]] === next) { e.preventDefault(); replaceRange(s - 1, s + 1, '', s - 1); return; }
  }
});

      case 'br': out += '<w:r><w:br/></w:r>'; break;
      case 'mathInline': out += wRun(t.text, { ...f, math: true }); break;
      case 'fnRef': { let n = FN.idx.get(t.id); if (!n) { FN.order.push(t.id); n = FN.order.length; FN.idx.set(t.id, n); } out += wRun(String(n), { ...f, sup: true, color: '8A5A3B' }); break; }
      case 'image': out += await wImage(String(t.href || ''), dec(t.text), X); break;
      case 'link': {
        const inner = await wInline(t.tokens, X, { ...f, link: true });
        if (/^(https?:|mailto:)/i.test(t.href)) {
          const rid = 'rId' + (X.rid++);
          X.rels.push(`<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="${xe(t.href)}" TargetMode="External"/>`);
          out += `<w:hyperlink r:id="${rid}">${inner}</w:hyperlink>`;
        } else out += inner;
        break;
      }
      case 'html': { if (/^<br\s*\/?>$/i.test(t.text.trim())) out += '<w:r><w:br/></w:r>'; else { const s = htmlText(t.text); if (s) out += wRun(s, f); } break; }
      default: if (t.tokens) out += await wInline(t.tokens, X, f); else if (t.text) out += wRun(dec(t.text), f);
    }
  }
  return out;
}
async function wBlock(t, X, c = {}) {
  const p = c.p || {};
  switch (t.type) {
    case 'space': case 'def': return '';
    case 'heading': return wPara(await wInline(t.tokens, X), { style: 'Heading' + t.depth });
    case 'paragraph': {
      const txt = (t.text || '').trim();
      if (/^\[\[?TOC\]?\]$/i.test(txt)) return '';
      const only = t.tokens.length === 1 && t.tokens[0].type === 'image';
      return wPara(await wInline(t.tokens, X), { ...p, jc: only ? 'center' : p.jc });
    }
    case 'text': return wPara(await wInline(t.tokens || [{ type: 'text', text: t.text }], X), p);
    case 'code': {
      const lang = (t.lang || '').toLowerCase();
      if (lang === 'mermaid') { const im = await wMermaid(t.text, X); if (im) return wPara(im, { jc: 'center' }); }
      if (lang === 'math' || lang === 'katex') return wPara(wRun(t.text, { math: true }), { jc: 'center' });
      return t.text.split('\n').map(l => wPara(wRun(l, { code: true, block: true }), { style: 'CodeBlock' })).join('');
    }
    case 'mathBlock': return wPara(wRun(t.text, { math: true }), { jc: 'center' });
    case 'blockquote': {
      let toks = t.tokens, title = '';
      const first = toks[0];
      const m = first && first.type === 'paragraph' && /^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i.exec(first.text || '');
      if (m) {
        title = wPara(wRun(ALERTS[m[1].toUpperCase()][1], { b: true, color: '8A5A3B' }), { style: 'Quote' });
        const rest = first.text.slice(m[0].length);
        toks = [...(rest.trim() ? mdInst.lexer(rest) : []), ...toks.slice(1)];
      }
      let out = title;
      for (const x of toks) out += await wBlock(x, X, { ...c, p: { ...p, style: 'Quote' } });
      return out;
    }
    case 'list': {
      let numId = 1;
      if (t.ordered) { numId = X.nums.length + 2; X.nums.push(Number(t.start) || 1); }
      const lvl = c.lvl == null ? 0 : c.lvl + 1;
      let out = '';
      for (const it of t.items) {
        let first = true;
        for (const sub of it.tokens) {
          if (sub.type === 'list') { out += await wBlock(sub, X, { ...c, lvl }); continue; }
          if (sub.type === 'text' || sub.type === 'paragraph') {
            const pre = first && it.task ? wRun(it.checked ? '☑ ' : '☐ ', {}) : '';
            out += wPara(pre + await wInline(sub.tokens || [{ type: 'text', text: sub.text }], X), first ? { style: 'ListParagraph', num: [numId, Math.min(lvl, 8)] } : { style: 'ListParagraph', ind: 720 * (lvl + 1) });
          } else out += await wBlock(sub, X, { ...c, lvl });
          first = false;
        }
      }
      return out;
    }
    case 'table': {
      const n = t.header.length, colW = Math.floor(9000 / n);
      const jc = a => (a === 'center' || a === 'right') ? a : undefined;
      const borders = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="D9C8A9"/>`).join('');
      let x = `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${borders}</w:tblBorders><w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${`<w:gridCol w:w="${colW}"/>`.repeat(n)}</w:tblGrid>`;
      const row = async (cells, head) => {
        let r = `<w:tr>${head ? '<w:trPr><w:tblHeader/></w:trPr>' : ''}`;
        for (let i = 0; i < n; i++) {
          const cell = cells[i] || { tokens: [] };
          r += `<w:tc><w:tcPr><w:tcW w:w="${colW}" w:type="dxa"/>${head ? '<w:shd w:val="clear" w:color="auto" w:fill="F5F1E8"/>' : ''}</w:tcPr>${wPara(await wInline(cell.tokens, X, head ? { b: true, color: '244D3A' } : {}), { style: 'TableText', jc: jc(t.align[i]) })}</w:tc>`;
        }
        return r + '</w:tr>';
      };
      x += await row(t.header, true);
      for (const r of t.rows) x += await row(r, false);
      return x + '</w:tbl>' + wPara('', { style: 'TableText' });
    }
    case 'hr': return '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="D9C8A9"/></w:pBdr></w:pPr></w:p>';
    case 'html': { const s = htmlText(t.text).trim(); return s ? wPara(wRun(s), p) : ''; }
    default: return t.tokens ? wPara(await wInline(t.tokens, X), p) : (t.text ? wPara(wRun(dec(t.text)), p) : '');
  }
}

async function backup() {
  await saveNow();
  const imgs = await DB.all('images');
  const used = new Set(docs.flatMap(d => [...d.body.matchAll(/img:([\w-]+)/g)].map(m => m[1])));
  const out = {
    app: 'markdowner', version: 1, exported: new Date().toISOString(),
    docs: docs.map(d => ({ id: d.id, name: d.name, body: d.body, created: d.created, updated: d.updated, fav: d.fav, trashed: d.trashed })),
    images: await Promise.all(imgs.filter(i => used.has(i.id)).map(async i => ({ id: i.id, name: i.name, type: i.blob.type, data: (await blobToDataURL(i.blob)).split(',')[1] }))),
  };
  download(new Blob([JSON.stringify(out)], { type: 'application/json' }), `markdowner-백업-${ymd()}.json`);
  toast(`문서 ${docs.length}개를 백업했어요`);
}
async function restoreBackup(file) {
  let j;
  try { j = JSON.parse(await file.text()); } catch { throw new Error('백업 파일을 읽을 수 없어요'); }
  if (!j || j.app !== 'markdowner' || !Array.isArray(j.docs)) throw new Error('Markdowner 백업 파일이 아니에요');
  for (const im of j.images || []) {
    if (!(await DB.get('images', im.id).catch(() => null))) await DB.put('images', { id: im.id, name: im.name || '', blob: b64ToBlob(im.data, im.type || 'image/png'), created: Date.now() });
  }
  let add = 0, upd = 0;
  for (const d of j.docs) {
    if (!d || !d.id || typeof d.body !== 'string') continue;
    const ex = docs.find(x => x.id === d.id);
    const rec = { id: d.id, name: d.name || '', body: d.body, created: d.created || Date.now(), updated: d.updated || Date.now(), fav: !!d.fav, trashed: d.trashed || 0 };
    if (!ex) { docs.push(rec); await DB.put('docs', rec); add++; }
    else if (rec.updated > ex.updated) { Object.assign(ex, rec); await DB.put('docs', ex); upd++; if (cur && cur.id === ex.id) { ed.value = ex.body; renderPreview(); } }
  }
  renderList();
  toast(`복원 완료: 새 문서 ${add}개, 갱신 ${upd}개`);
}

function lineDiff(a, b) {
  const A = a.split('\n'), B = b.split('\n');
  if (A.length * B.length > 4e6) return null;
  const n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (A[i] === B[j]) { out.push([0, A[i]]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) { out.push([-1, A[i++]]); } else out.push([1, B[j++]]); }
  while (i < n) out.push([-1, A[i++]]); while (j < m) out.push([1, B[j++]]);
  return out;
}

    </div>`);
  b.oninput = e => {
    const t = e.target;
    if (t.id === 'sFont') { S.fontSize = +t.value; $('#sFontV').textContent = t.value + 'px'; }
    if (t.id === 'sWidth') { S.width = +t.value; $('#sWidthV').textContent = t.value; }
    applySettings(); saveSettings();
  };
  b.onchange = e => {
    const t = e.target, id = t.id;
    const map = { sWrap: 'wrap', sAuto: 'autopair', sType: 'typewriter', sSpell: 'spell', sBreaks: 'breaks', sSync: 'sync', sPaste: 'pasteHtml' };
    if (map[id]) S[map[id]] = t.checked;
    if (id === 'sEdFont') S.edFont = t.value;
    if (id === 'sPvFont') S.pvFont = t.value;
    if (id === 'sImg') S.imgMax = +t.value;
    saveSettings(); applySettings();
    if (id === 'sBreaks') { buildMarked(); renderPreview(); }
    if (id === 'sPaste' && S.pasteHtml) getTD().catch(() => {});
  };
  b.onclick = async e => {
    if (e.target.closest('#sBackup')) backup();
    if (e.target.closest('#sRestore')) { dlg.close(); $('#fileInput').click(); }
    if (e.target.closest('#sClean')) {
      const used = new Set(docs.flatMap(d => [...d.body.matchAll(/img:([\w-]+)/g)].map(m => m[1])));
      for (const v of await DB.all('versions')) for (const m of v.body.matchAll(/img:([\w-]+)/g)) used.add(m[1]);
      const all = await DB.all('images'); let n = 0;
      for (const im of all) if (!used.has(im.id)) { await DB.del('images', im.id); n++; }
      toast(n ? `쓰지 않는 이미지 ${n}개를 지웠어요` : '정리할 이미지가 없어요');
    }
  };
}

/* ================= Sidebar bindings ================= */
$('#docList').addEventListener('click', e => {
  const more = e.target.closest('[data-more]');
  if (more) { e.stopPropagation(); const d = docs.find(x => x.id === more.dataset.more); if (d) { if (menuEl && menuEl._from === more) { closeMenu(); return; } docMenu(more, d); menuEl._from = more; } return; }
  if (e.target.closest('#emptyTrash')) { (async () => { const t = docs.filter(d => d.trashed); if (!t.length) return; if (await confirmBox(`휴지통의 문서 ${t.length}개를 완전히 지울까요?`, '모두 지우기', true)) { for (const d of t) await deleteForever(d); renderList(); } })(); return; }
  const it = e.target.closest('.doc-item');
  if (!it) return;
  const d = docs.find(x => x.id === it.dataset.id);
  if (!d) return;
  if (d.trashed) { docMenu(it.querySelector('.more'), d); return; }
  openDoc(d.id);
});
$('#docList').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('doc-item')) e.target.click(); });

$$('.chip[data-filter]').forEach(c => c.onclick = () => setFilter(c.dataset.filter));

ti.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); ti.blur(); if (!isTouch) ed.focus(); } if (e.key === 'Escape') { ti.value = cur?.name || ''; ti.blur(); } });

/* ================= Welcome document ================= */
const WELCOME = `# Markdowner에 오신 것을 환영합니다

**Markdowner**는 브라우저에서 바로 쓰는 *마크다운* 문서 편집기예요. 쓰는 내용은 ==이 기기에만 자동 저장==되고, 어디에도 보내지 않아요.

[TOC]

## 이렇게 써 보세요

- 왼쪽에 마크다운을 쓰면 오른쪽에 바로 보입니다.
- 위쪽 도구 막대나 단축키(\`Ctrl+B\`, \`Ctrl+K\` …)로 서식을 넣을 수 있어요.
- **서식 편집**을 누르면 미리보기 화면을 워드처럼 바로 고칠 수 있어요.
- 사진은 붙여넣거나 끌어다 놓으면 됩니다.

### 할 일 목록

- [x] Markdowner 열기
- [ ] 미리보기에서 이 칸을 눌러 보기
- [ ] 첫 문서 쓰기

> [!TIP]
> \`F1\`을 누르면 단축키와 문법을 한눈에 볼 수 있어요.

## 표

| 기능 | 설명 | 지원 |
| :--- | :--- | :--: |
| 내보내기 | MD, HTML, PDF, Word, TXT | ✓ |
| 가져오기 | MD, TXT, HTML, Word(.docx) | ✓ |
| 버전 기록 | 자동 저장 + 되돌리기 | ✓ |

## 코드

\`\`\`js
function greet(name) {
  return \`안녕하세요, \${name}님!\`;
}
\`\`\`

## 수식

아인슈타인의 식 $E = mc^2$ 처럼 문장 안에 넣거나, 블록으로 쓸 수 있어요.

$$
x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}
$$

## 다이어그램

\`\`\`mermaid
flowchart LR
  A[쓰기] --> B[미리보기]
  B --> C{마음에 드나요?}
  C -- 네 --> D[내보내기]
  C -- 아니요 --> A
\`\`\`

## 각주

마크다운은 2004년에 처음 나왔어요.[^1]

[^1]: John Gruber와 Aaron Swartz가 만들었습니다.
`;

/* ================= Init ================= */
async function init() {
  buildMarked();
  applySettings();
  $('#sortSel').value = S.sort;
  $('#sortLabel').textContent = $('#sortSel').selectedOptions[0]?.textContent || '수정순';
  setSideTab(S.stab || 'docs');
  let v = S.view;
  if (v === 'rich') v = 'preview';
  if (v === 'split' && innerWidth < 700) v = 'edit';
  S.view = v;
  document.body.dataset.view = v;
  $$('#viewSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  try {
    docs = await DB.all('docs');
  } catch (e) {
    toast('이 브라우저에서는 저장소를 쓸 수 없어요. 개인 정보 보호 모드인지 확인해 주세요.', null, null, 8000);
    docs = [];
  }
  const cutoff = Date.now() - 30 * 86400000;
  for (const d of docs.filter(d => d.trashed && d.trashed < cutoff)) await deleteForever(d).catch(() => {});
  if (!docs.length) {
    try { await createDoc(WELCOME, '', false); } catch { docs.push({ id: uid(), name: '', body: WELCOME, created: Date.now(), updated: Date.now(), fav: false, trashed: 0 }); }
  }
  const last = docs.find(d => d.id === S.lastDoc && !d.trashed) || docs.filter(d => !d.trashed).sort((a, b) => b.updated - a.updated)[0];
  if (last) await openDoc(last.id); else await createDoc('');
  if (narrow()) document.body.classList.remove('drawer');
  updateUsage();
  if (S.pasteHtml) setTimeout(() => getTD().catch(() => {}), 2500);
  window.addEventListener('message', () => {});
}
init();
})();
